douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解电饭煲
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：电饭煲。

    本集拆解：
    1. 加热盘怎么把米煮熟
    2. 为什么到点会跳闸保温
    3. 磁钢限温器在干什么

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #电饭煲原理 #磁钢限温 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：电饭煲是怎么把米煮熟还自动保温的。
      很多人以为，它只是一个会定时关火的电锅。
      其实更巧：它用温度当信号，水快干、锅底升温时自动切换到保温。
      不是靠猜时间，而是靠感知温度。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      底部加热盘通电发热，把热量传给内胆。
      内胆导热好，米和水一起升温、沸腾、吸水糊化。
      锅底中央有磁钢限温器，大约摄氏一百零三度左右会失磁跳开。
      还有保温电路，跳闸后用较小功率维持温度。
      蒸汽阀负责泄压排气，让沸腾过程更稳定。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：一锅饭怎么完成？
      第一步，加热盘持续加热，水温升到沸腾。
      第二步，米粒吸水膨胀，淀粉糊化，慢慢变熟。
      第三步，水快被吸收和蒸发完，锅底温度迅速升高。
      第四步，磁钢失磁，开关跳到保温，停止猛火加热。
      所以水没干之前，锅底被水顶在沸点附近；水一干，温度信号就出现了。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么水放太多会变稀、还可能溢锅？水分多，糊化与蒸发节奏被打乱。
      为什么内胆变形或没放正，煮不熟？接触不良，热量传不上去，限温也失准。
      为什么保温久了饭发黄？低温仍在缓慢失水、美拉德反应继续。
      一句话：电饭煲是「温度触发的自动厨师」，核心是限温，不只是计时。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：加热盘煮水，水干升温，磁钢跳闸转保温。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想拆豆浆机、空气炸锅，还是电热水壶？评论区告诉我。
