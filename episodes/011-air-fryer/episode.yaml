douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解空气炸锅
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：空气炸锅。

    本集拆解：
    1. 它不是无油油炸，是一台小型强制对流烤箱
    2. 电热管或 PTC 加热空气，风扇把热风高速吹过食物
    3. 篮孔、别堆满、薄油，各自在干什么

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #空气炸锅原理 #强制对流 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：空气炸锅是怎么把食物做脆的。
      很多人以为，它能变出一种空气油，不用下锅也能炸。
      其实没有油浴，也没有魔法油。
      它就是一台小烤箱：电热管加热空气，风扇把热风高速吹过食物。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      腔体顶部是电热管，通电后电阻发热；有的机型用 PTC 发热片，一样是把电变成热。
      风扇贴着发热体转，空气被压过去，变成高速热风。
      炸篮四周和底部有孔，风才能绕到食物下面。
      篮下是接油盘，接着滴下来的油和碎渣。
      温控器到温就停热管，排气口把湿气放出去。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：表面为什么会脆？
      第一步，电热管发热，靠近的那一面会被烤到，周围空气也被加热。
      第二步，风扇推动热风在小腔里打转，钻进篮孔，这就是强制对流。
      第三步，热风吹散食物表面那层凉空气，水分很快被带走。
      第四步，干了的表面温度升高，发生美拉德反应，颜色变深，口感变脆。
      薄油会摊成油膜，帮忙传热和上色；风大时还可能带起细小油雾，但食物并没有泡在油里。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么堆太满就不脆？风路被堵住，底部碰不到热风，只能被闷熟。
      为什么还建议薄薄刷一层油？油帮助传热和上色，不必把食物浸进油锅。
      为什么常常比家用烤箱更快？腔体小，热管离得近，风速更高，对流更猛。
      一句话：空气炸锅是高速热风烤箱，不是无油油炸。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：电热管加热，风扇造热风，吹干表面才变脆。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆电烤箱，还是换个别的家电？评论区告诉我。
