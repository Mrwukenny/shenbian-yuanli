  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解热水器
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：电热水器。

    本集拆解：
    1. 加热管怎么把水烧热
    2. 温控器、内胆、镁棒各自干什么
    3. 为什么会结垢、要定期维护

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #热水器原理 #加热管 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：电热水器是怎么把水烧热并存住的。
      很多人以为，它像烧水壶，一直开着大火烧。
      其实是「加热 + 保温 + 温控」三件套：烧到设定温度就停，温度掉了再补热。
      内胆像保温杯，尽量少让热量溜走。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      内胆里的电加热管通电发热，直接把周围水加热。
      温控器监测水温，到温断电，降温再接通。
      内胆外包厚厚的保温层，减少散热。
      镁棒是牺牲阳极，优先被腐蚀，保护内胆少生锈。
      安全阀在压力过高时泄压，防止内胆危险。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：热水怎么来？
      第一步，冷水从进水管进入内胆。
      第二步，加热管工作，水温上升；热水偏轻会往上走，形成自然分层。
      第三步，你打开混水阀，热水从上部出口流出，冷水从下部补入。
      第四步，水温低于设定值，温控再次启动补热。
      所以不是瞬间无限热水，而是一罐蓄热的水库，用多少补多少。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么有时一开始热，后面变凉？上层热水用完了，下层冷水被抽上来。
      为什么要定期清理水垢？水垢裹住加热管，传热变差，更费电还易干烧局部过热。
      为什么镁棒要换？它耗尽后，内胆更容易被腐蚀。
      一句话：热水器是带温控的储热罐，维护决定寿命和效率。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：加热管烧水，温控管开关，保温层锁热，镁棒护胆。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想拆燃气热水器、净水器，还是马桶水箱？评论区告诉我。
