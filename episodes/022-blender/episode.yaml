douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解破壁机
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：破壁机。

    本集拆解：
    1. 渣和汁都留在杯里，不是把渣分离出去的榨汁机
    2. 高速刀片切碎，旋涡把食材一次次送回刀上
    3. 加热是可选项；细胞被切开，不等于营养翻倍

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #破壁机原理 #高速搅拌 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：破壁机靠什么把食材打成浆。
      很多人以为，它是转速更高的榨汁机。
      其实榨汁机要把渣分开。
      破壁机把渣和汁一起留在杯里。
      高速刀片把块切碎。
      旋涡再把碎块一次次送回刀上。
      有的还能加热，把浆煮熟。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      电机在底座。
      底座的卡齿咬住杯底的刀轴。
      刀片在杯底，常常是几片不同角度。
      转速可以到每分钟两万转以上。
      杯壁上有凸起的筋。
      筋把旋涡打乱一点。
      食材才会反复落到刀上。
      盖子上留着排气盖。
      加热时，蒸汽要有路走。
      有的杯底有加热盘。
      不加热，它就是高速搅拌机。
      加热时边搅边煮，用来做豆浆或汤。
      它没有榨汁机那种出渣口。
      纤维还在杯子里。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：块怎么变成细浆？
      第一步，电机带动刀片高速转。
      刀刃切开食材，也把颗粒撞碎。
      第二步，液体在杯里形成旋涡。
      中间往下，四周往上。
      第三步，颗粒一次次回到刀上，越打越细。
      第四步，要加热时，底部加热盘工作。
      搅动把热量散开，减少糊底。
      液体太少，旋涡就立不住。
      刀在中间空转，块还贴在杯壁。
      所以不只有快刀，还要液体把料送回来。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么干果打不动？
      没有液体把它们带回刀上。
      为什么说破壁就营养翻倍，要小心？
      刀片确实会切开很多植物细胞。
      口感更细，有的成分更好溶出。
      也更接触空气，更容易被氧化。
      它不是营养印钞机。
      为什么热了不能扣死盖再猛打？
      热浆会胀。
      先留排气，再低速搅。
      和榨汁机比，你喝到的是整杯浆。
      纤维还在，所以更稠。
      一句话：高速刀切碎，旋涡送回刀上。
      渣和汁都留下。
      加热是把浆煮熟。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：高速刀片切碎，旋涡负责送料。
      渣和汁都留在杯里。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆干衣机，还是换个别的家电？评论区告诉我。
