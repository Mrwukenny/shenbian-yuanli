douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解路由器
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：路由器。

    本集拆解：
    1. 路由器不生产网络，外面的网从光猫进来
    2. 它看小包要去哪，再用无线电和手机轮流发送
    3. Wi-Fi 满格只说明无线电近。人多会挤在同一条信道上

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #路由器原理 #转发无线电 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：路由器靠什么让手机上网。
      很多人以为，路由器自己在生产网络。
      或者信号满格，就一定上得了网。
      其实它更像一个路口。
      多数家里，外面的网先到光猫。
      再进路由器。
      路由器再用无线电，和手机轮流说话。
      连上 Wi-Fi，只说明你进了这个路口。
      外网断了，手机一样出不去。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      路由器有一个口，接着光猫。
      外面的网，从这里进来。
      你可以把光猫理解成门外的路。
      路由器看每一小包要去哪。
      去手机的，就交给无线电。
      去外面的，就送回光猫。
      天线上发出的，是无线电。
      不是一根管子里的水。
      手机里也有天线。
      两边要调到同一个频道上说话。
      这个频道，叫信道。
      同一个信道里，大家得轮流说。
      一起吼，谁也听不清。
      名字是它在喊的招牌。
      密码用来确认，谁可以加入这段对话。
      加入了，还不等于门外的路是通的。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：一次打开网页，中间发生了什么？
      第一步，光猫把外面的网送到路由器。
      第二步，手机对上名字和密码。
      它加入这段无线电对话。
      第三步，你点开网页。
      手机把请求装进一个小包，用无线电发出。
      第四步，路由器看这个包要去外面。
      它从光猫那头送出去。
      回来的包，再用无线电送给手机。
      满格，只说明这一小段无线电很近。
      门外断了，包就出不去。
      人一多，常常挤在同一条信道上。
      每个人分到的说话时间变少，网就慢。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么信号满格，网页却打不开？
      满格是手机离路由器近。
      外面的网断了，路口里面照样出不去。
      为什么人多就变慢？
      大家共用一条信道，只能轮流说话。
      人多，每台设备等到的空隙就少。
      为什么隔一堵墙，格数就掉？
      墙会挡住和吸收无线电。
      不是路由器把你的网关掉了。
      这集只讲家里这一段怎么转发。
      不讲套餐速度，也不讲运营商。
      一句话：路由器转发小包，Wi-Fi 只是那段无线电。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：外面的网从光猫进来。
      路由器用无线电，和手机轮流把包送过去。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆榨汁机，还是换个别的家电？评论区告诉我。
