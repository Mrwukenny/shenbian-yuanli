douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解浴霸
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：浴霸。

    本集拆解：
    1. 灯暖的红外线穿过空气，先被人和墙壁吸收
    2. 风暖用风机把空气吹过发热体，暖和的是空气
    3. PTC 越热电阻越大，自己限制功率。换气是另一条风路

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #浴霸原理 #灯暖风暖 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：浴霸靠什么让浴室暖和。
      很多人以为，洗澡前的热都是一回事。
      灯亮了，空气就跟着热了。
      其实常见有两条路。
      灯暖用红外线，直接照到人和墙。
      空气本身升温很慢。
      风暖用风机，把空气吹过发热体。
      暖和的是空气，再碰到你。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      灯暖的灯泡里，有一根很烫的灯丝。
      灯丝向外发出红外线。
      红外线穿过空气。
      它打到皮肤和瓷砖上，才被吸收。
      人站在灯下，会先觉得暖。
      房间里的空气，可以还是凉的。
      风暖的主角，是风机和发热体。
      风机把浴室里的空气吸进来。
      空气擦过发热体，带走热量。
      再从出风口送回浴室。
      很多发热体是陶瓷 PTC。
      温度升高，它的电阻跟着变大。
      电流变小，功率自己降下来。
      它是在限制自己的温度。
      旁边常常还有一条换气风路。
      那是把湿空气送出浴室。
      换气和取暖，不是同一股风。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：热怎么到你身上？
      第一步，先看你开的是哪一种。
      灯暖先让灯丝烧热。
      风暖先让风机转起来。
      第二步，灯暖射出红外线。
      射线穿过空气，打到人和墙上。
      第三步，风暖把空气吹过发热体。
      热空气从风口出来，再碰到你。
      第四步，PTC 看着自己的温度。
      越热，电阻越大，功率就下降。
      灯暖几乎不靠把整屋空气烤热。
      风暖几乎不靠那几根红外线。
      两条路，热到达的顺序不一样。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么灯亮了，人暖了，空气还凉？
      红外线先被皮肤和墙壁吸收。
      空气对这种射线比较透明。
      为什么风暖要等一会儿，整个浴室才暖？
      它得先加热一大团空气。
      空气再把热带到各个角落。
      为什么出风口不该被毛巾堵住？
      风带不走热，热量就堆在机器里。
      PTC 会把功率降下来，浴室却没暖到。
      换气扇响，不代表正在取暖。
      那条风路是把湿气送出去。
      一句话：灯暖烤人和墙，风暖先加热空气。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：灯暖靠红外线。
      风暖靠热空气吹过来。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆消毒柜，还是换个别的家电？评论区告诉我。
