douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解电视
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：电视。

    本集拆解：
    1. 液晶自己不发光，背后的灯提供光
    2. 液晶决定光过不过，红绿蓝滤色片负责上色
    3. 有的屏每个点自己发光。这集不比品牌和清晰度

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #电视原理 #液晶背光 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：电视靠什么自己把画面亮出来。
      很多人以为，它和投影仪一样。
      光是被打到墙上的。
      或者颜色是印在屏幕上的。
      其实光从屏幕自己出来。
      常见的液晶屏，背后有灯。
      液晶自己不发光。
      它决定这些光，过还是挡住。
      还有一种屏，每个小点自己会亮。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      液晶屏的最后面，是背光。
      现在多是很多小灯珠。
      它们只负责把光打出来。
      没有背光，液晶再转也是黑的。
      灯前面有一层液晶。
      液晶自己不亮。
      你可以把它理解成一排小百叶。
      不是真的有叶片在转。
      这一层决定光过不过。
      转开，这一点就亮。
      合上，这一点就暗。
      再前面是红、绿、蓝滤色片。
      三个小点挨着，合成一个彩色点。
      背光先到，颜色后加上。
      还有一种屏，没有背后这块光。
      每个小点自己发光。
      要黑，就把那个点关掉。
      光不经过墙。
      它从屏幕直接进到眼睛里。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：一个亮点怎么出现？
      第一步，背后的灯先亮起。
      没有这层光，前面没有东西可放。
      第二步，液晶按画面变化。
      该亮的地方让光通过。
      该暗的地方尽量挡住。
      第三步，滤色片给通过的光上色。
      红、绿、蓝拼成你看见的点。
      第四步，光从屏幕进到眼睛。
      眼睛接到的，是屏幕放出的光。
      墙没有接住这束光。
      换成小点自己会亮的屏。
      黑的地方，是这个点没亮。
      说白了，液晶是在放行背后的光。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么液晶的黑看起来发灰？
      背后的灯其实还亮着。
      这一层挡不严，就漏出一点光。
      发灰是漏光，不是信号变灰了。
      不是画面故意铺了一层灰。
      为什么有的屏黑得更干净？
      那些小点自己发光。
      要黑，这个点就关掉。
      没有一整块背光在后面漏。
      为什么侧着看容易发灰？
      液晶和滤色片对着正前方。
      侧过去，没挡住的光变多。
      这集不比较品牌，也不比清晰度。
      一句话：液晶放行背光，有的点自己发光。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：液晶自己不发光。
      它决定背后的光，过还是挡住。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆哪一件？评论区告诉我。
