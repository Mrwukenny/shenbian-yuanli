douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解电动牙刷
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：电动牙刷。

    本集拆解：
    1. 电机带动刷头，旋转摆动或者高频振动
    2. 软垢要靠刷毛尖端扫掉，声波不是隔空清洗
    3. 压太重，刷毛会倒伏；更窄的缝，晃动代替不了刷毛

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #电动牙刷原理 #刷毛摆动 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：电动牙刷靠什么刷干净。
      很多人以为，它靠声波把牙震干净。
      刷毛甚至不用碰到牙面。
      其实不是。
      马达带动刷头，刷毛在牙面上来回扫。
      扫掉的是刷毛碰到的那层软垢。
      声波这两个字，是说刷头摆得很快。
      快到人耳听得见嗡嗡声。
      它不是一把隔空清洗的枪。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      手柄里是一只小电机。
      电机通过连杆，带动上面的刷头。
      刷头上是一束束刷毛。
      清洁靠的是刷毛尖端。
      常见分成两类。
      一类叫旋转摆动。
      刷毛绕着刷头中心，来回转一个小角度。
      另一类常被叫做声波。
      刷头整体高频振动。
      快的可以到每分钟三万次上下。
      两种都是机械运动。
      刷毛一动，旁边的液体也会跟着晃。
      紧挨着的缝边，可能多带走一点。
      更窄的牙缝，晃动代替不了刷毛。
      手柄里的计时，只提醒你换一块牙面。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：软垢怎么离开牙面？
      第一步，电机转起来，刷头跟着动。
      第二步，你把刷毛轻轻贴上牙面。
      刷毛尖端沿着牙面扫过。
      第三步，看刷头是哪一种动法。
      旋转型在小范围里来回转。
      声波型是整排刷毛快速颤动。
      软垢被刮松，随着刷毛离开牙面。
      第四步，你把刷头移到下一块。
      刷毛没贴住的地方，不会自己干净。
      要是压得很重，刷毛会倒伏。
      尖端不再竖着扫，扫过的距离变短。
      所以是轻贴，让刷毛自己动。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么嗡嗡响，却没有刷干净？
      响声只说明刷头在振动。
      刷毛离开牙面，就只剩下声音。
      为什么越用力，不一定更干净？
      刷毛被压弯，尖端扫过的路程变短。
      有的机器会亮灯，提醒你减轻一点。
      为什么牙缝里还会有残留？
      刷毛有粗细，进不去比它更窄的缝。
      摆动改变不了这个几何关系。
      这集只讲刷毛怎么动。
      不讲牙膏配方，也不讲口腔疾病。
      一句话：电机带动刷毛，贴住牙面才算刷到。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：刷毛贴着牙面扫。
      声波是摆得快，不是隔空洗。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆燃气灶，还是换个别的家电？评论区告诉我。
