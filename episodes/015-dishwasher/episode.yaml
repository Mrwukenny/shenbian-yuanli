douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解洗碗机
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：洗碗机。

    本集拆解：
    1. 喷臂靠斜孔的反作用力自己转
    2. 加热管配合碱和酶，拆油、蛋白和淀粉
    3. 排水泵抽走脏水，不是超声，也不是一滩水冲到底

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #洗碗机原理 #喷淋洗涤 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：洗碗机是怎么把碗洗干净的。
      很多人以为，它就是特别猛的花洒。
      其实水柱只占一部分。
      循环泵把水打进喷臂，加热管把水加热。
      洗涤剂在合适温度下拆油和淀粉。
      排水泵再把脏水抽走。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      底部是集水槽，洗过的水在这里汇合。
      循环泵再把这些水吸走、加压。
      喷臂是空心的，上面有斜孔。
      水从斜孔喷出，反作用力让它自己转。
      一般没有单独的马达去拧喷臂。
      加热管在水槽里，或者藏在水路中。
      洗涤剂仓到点才打开。
      碱帮助拆油脂，酶帮助拆蛋白和淀粉。
      过滤器拦住残渣，别让它一直循环。
      旁边有小排水泵，把脏水送出机外。
      漂洗剂降低表面张力，水更快滑走。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：一次洗涤在干什么？
      第一步，进水。循环泵给喷臂加压。
      斜孔喷水，喷臂旋转，先冲松散残渣。
      第二步，加热管把水加热，油脂变软。
      温度上来，洗涤剂才更好干活。
      第三步，主洗。碱拆油，酶拆蛋白和淀粉。
      水经过过滤器，再被泵打回去。
      第四步，排水泵抽走脏水，换水漂洗。
      再靠加热或余热烘干。
      漂洗剂让水铺开，碗上少留水珠。
      所以它不是超声清洗，也不是一滩水冲到底。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么碗叠太密就洗不净？
      喷臂的水打不到背面，冲刷这一步断了。
      为什么要用洗碗机专用洗涤剂？
      手洗泡沫太多，会溢，也不适合循环泵。
      为什么节能档温度不高、时间更长？
      酶在温热里工作，不必一直烧得很烫。
      高温更偏重油和烘干。
      一句话：喷臂冲，加热配药剂，排水泵收尾。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：斜孔转喷臂，加热配洗涤剂。
      排水泵把脏水送走。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆电风扇，还是换个别的家电？评论区告诉我。
