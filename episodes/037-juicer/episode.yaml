douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解榨汁机
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：榨汁机。

    本集拆解：
    1. 离心篮子高速转，汁被甩过网，渣留在篮里
    2. 慢磨用螺杆把果肉挤过滤网，渣从另一头排出
    3. 破壁机没有这层留渣的网，打出来是糊。这集不讲营养

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #榨汁机原理 #汁渣分离 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：榨汁机靠什么把果汁和渣分开。
      很多人以为，它和破壁机一样，把水果打成糊。
      打得越碎，就越是果汁。
      其实它多了一步分离。
      快的那种，篮子高速转。
      汁被甩过网，渣留在网里。
      慢的那种，螺杆慢慢挤。
      汁从缝里渗出，渣从另一头走。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      两种机器，都有电机，也都有一张网。
      网的孔，让汁过去。
      比孔粗的纤维，过不去。
      这就是渣。
      快的那种，网做成一只篮子。
      底部有刀盘，先把果肉切碎。
      电机带着篮子高速转。
      你可以把它理解成甩干桶。
      汁被甩向篮壁，穿过小孔。
      渣被网拦住，留在篮里。
      慢的那种，主角是一根螺杆。
      螺杆转得很慢，把果肉往前推、挤碎。
      汁从旁边的滤网渗下去。
      渣被继续推到另一头，排出来。
      所以杯子里接到的是汁。
      篮里或渣盒里留下的，才是渣。
      破壁机没有这层专门留渣的网。
      它的目标，是把渣也留在液体里。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：汁和渣怎么分开？
      第一步，果肉先被切开。
      快的用刀盘，慢的用螺杆挤。
      第二步，碎果肉贴到网上。
      第三步，看它靠甩，还是靠挤。
      篮子一转，汁穿过小孔飞出去。
      螺杆一推，汁从滤网的缝里渗出。
      第四步，过不了孔的纤维留下。
      快的留在篮子里。
      慢的从末端排进渣盒。
      杯子里接到的，是穿过网的那一部分。
      没有这张网，出来的就是带渣的糊。
      说白了，网决定谁能离开，谁留下。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么汁放一会儿会分层？
      细小的纤维也跟着汁穿过了网。
      静置以后，重一点的往下沉。
      不是机器没榨完。
      为什么叶子用快的那种，常常出汁少？
      叶子轻，纤维多。
      还没把汁甩出来，就被带着走。
      慢磨靠挤，更能把叶子里的汁挤出。
      为什么破壁机打出来是糊？
      它不靠这层网把渣留下来。
      目标是全都留在杯里，打得更细。
      这集不讲营养谁更高。
      一句话：汁过网，渣留下，靠甩或者靠挤。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：网让汁过去。
      过不了孔的，就是渣。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆哪一件？评论区告诉我。
