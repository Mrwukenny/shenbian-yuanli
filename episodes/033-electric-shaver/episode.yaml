douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解剃须刀
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：剃须刀。

    本集拆解：
    1. 网罩几乎不动，硬的胡茬钻进小孔，里面的刀片切过去
    2. 皮肤被网托住。按得太狠，皮才会鼓进孔里
    3. 圆网旋转和平网来回，都是网外刀内。长胡子要先剪短

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #剃须刀原理 #网罩剪切 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：剃须刀靠什么切断胡茬。
      很多人以为，刀片直接贴着脸刮。
      或者按得越用力，就刮得越干净。
      其实外面那层网罩，几乎不动。
      胡茬又细又硬，会钻进小孔。
      里面的刀片贴着网罩内侧切过去。
      皮肤被网托住，平时进不了孔。
      你要是按得很死，皮才会鼓进去。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      机身里有一只小电机。
      电机带动里面的刀片。
      外面罩着一层很薄的网。
      网上是一排排小孔。
      胡茬伸得进去。
      连成片的皮肤，伸不进去。
      刀片贴着网罩的内侧走。
      胡茬一伸进孔，就被切断。
      有的刀头是三只圆网。
      圆网里面的刀，在转。
      有的是一整片平网。
      平网里面的刀，左右来回。
      两条路，都是网在外，刀在内。
      刀头会浮动。
      它是为了贴着脸的弧度。
      不是为了让你把网罩按瘪。
      旁边有时还有一把小修剪器。
      那是先对付还没钻进孔的长胡子。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：胡茬怎么被切断？
      第一步，电机带动内刀动起来。
      圆网里是转，平网里是来回。
      第二步，胡茬钻进网罩的小孔。
      胡子细，又比较硬，立得住。
      第三步，内刀从孔边切过。
      伸进来的那一截，被剪断。
      第四步，断茬留在网罩里。
      皮肤仍在网外，碰不到刀刃。
      你要是把脸压进孔里。
      皮鼓进去，刀就会碰到。
      所以贴着走，别压得很死。
      说白了，网罩挡住皮，内刀负责剪。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么按得很痛，也不更干净？
      用力会让皮肤鼓进小孔。
      刀碰到的是皮，不是把根部多切掉一截。
      为什么三圈转，和一片网左右动，都能用？
      都是外罩留在脸上，内刀在里面切。
      路径不一样，剪切是一样的。
      为什么长胡茬会打滑？
      太长的胡子会倒伏，进不了孔。
      先用旁边的修剪器剪短。
      短茬立起来，才钻得进网。
      这集只讲怎么切断。
      不讲肤质，也不讲刀片品牌。
      一句话：网罩挡住皮，内刀切断钻进来的胡子。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：网罩把皮留在外面。
      钻进孔的胡茬，才被内刀切断。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆电暖器，还是换个别的家电？评论区告诉我。
