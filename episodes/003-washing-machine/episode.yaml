  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解洗衣机
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：洗衣机。

    本集拆解：
    1. 洗衣机不是只会「搅水」
    2. 摩擦、洗涤剂、水流怎么配合
    3. 甩干为什么靠离心力

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #洗衣机原理 #离心力 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：洗衣机是怎么把衣服洗干净的。
      很多人以为，洗衣机就是一个大桶在搅水，衣服泡一泡就干净了。
      其实不是。
      它做的是三件事一起上：水流冲刷、衣物互相摩擦，再加上洗涤剂把油污「撬」下来。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      中间那只大桶叫内筒，上面布满小孔，既能装衣服，又能让水进出。
      波轮洗衣机底部有波轮，来回转动搅起水流；滚筒洗衣机则靠水平滚筒抬起又摔落衣物。
      底部电机提供动力，排水泵负责把脏水抽走。
      进水阀控制清水进入，水位开关或传感器决定水加到哪里。
      整机就像一条流水线：进水、洗涤、排水、漂洗、甩干，按程序自动切换。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：衣服上的脏东西怎么离开？
      第一步，清水和洗涤剂把纤维润湿，降低表面张力，水才钻得进布料缝隙。
      第二步，波轮或滚筒让衣物翻滚、摩擦，机械力把粘在表面的泥沙蹭掉。
      第三步，洗涤剂分子一头亲水、一头亲油，像无数小钩子，把油污从纤维上拽进水里。
      第四步，排水带走脏水，再进清水漂洗，把残留泡沫和污垢冲干净。
      最后甩干：内筒高速旋转，水在离心力作用下被甩出小孔，衣服才变得半干。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个日常现象。
      为什么不能塞太满？衣服转不动、摩擦不够，反而洗不干净，还伤电机。
      为什么洗涤剂不能倒太多？泡沫过多难漂净，残留反而刺激皮肤。
      为什么甩干时机会「走路」？衣物偏心，离心力一边大一边小，机身就会晃。
      一句话：洗衣机靠力学和化学联手去污，不是魔法，也不是单纯泡水。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：水流冲、衣物搓、洗涤剂撬污，离心力甩干。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想拆冰箱、吸尘器，还是抽油烟机？评论区告诉我。
