douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解投影仪
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：投影仪。

    本集拆解：
    1. 很亮的灯提供光，色轮让红绿蓝飞快轮流出现
    2. 小镜子翻向镜头这一点就亮，翻开就暗
    3. 镜头把光放大打到墙上。墙只是把光弹回眼睛

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #投影仪原理 #镜头投光 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：投影仪靠什么把画面打到墙上。
      很多人以为，墙自己变成了一块屏幕。
      或者画面是被贴在墙上的。
      其实墙只会把光弹回来。
      画面先在机器里一块很小的芯片上成形。
      镜头再把这束光放大。
      打到墙上，再进到你眼睛里。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      机身里有一盏很亮的灯。
      有的是发光二极管，有的是激光。
      它们只负责提供光。
      很多家用机里，还有一只色轮。
      红、绿、蓝三块颜色，飞快地转。
      眼睛反应没那么快。
      三种光轮流来，看起来就是彩色。
      旁边有一块很小的芯片。
      上面是密密麻麻的小镜子。
      某一块镜子翻向镜头，这一点就亮。
      翻开，这一点就暗。
      整幅画面，就是这些亮和暗拼出来的。
      镜头在最前面。
      它把这一小幅光放大，打到墙上。
      镜头只是把已经分好亮暗的光放大。
      颜色和亮暗，在进镜头之前就定了。
      墙不负责制造画面。
      它只是把打过来的光，散射回你的眼睛。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：小画面怎么变成墙上的大画面？
      第一步，灯发出很亮的光。
      第二步，色轮飞快转动。
      同一点轮流变成红、绿、蓝。
      第三步，小镜子按画面翻转。
      该亮的光，被送进镜头。
      该暗的光，被拨到旁边。
      第四步，镜头把光放大，打到墙上。
      墙把光弹回眼睛，你才看见画面。
      墙越白，弹回来的越多。
      房间里别的光越少，对比越清楚。
      说白了，投影仪在投光，不是在墙上画画。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么白天看着发灰？
      窗户的光也打在同一面墙上。
      它把画面冲淡了。
      不是镜头突然变暗。
      为什么深色墙投出来很闷？
      深色把更多的光吃掉。
      弹回眼睛的那一部分变少。
      为什么要对焦？
      镜头要把那一小幅画，对到墙的距离上。
      对焦调的是清楚不清楚。
      不是把像素变多。
      这集不比较亮度和品牌。
      一句话：芯片决定亮暗，镜头把光打到墙上。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：画面先在小芯片上成形。
      镜头投光，墙只负责把光弹回来。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆路由器，还是换个别的家电？评论区告诉我。
