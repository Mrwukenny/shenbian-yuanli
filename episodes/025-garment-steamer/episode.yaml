douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解挂烫机
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：挂烫机。

    本集拆解：
    1. 常压蒸汽喷到衣服上，放热并凝成水
    2. 棉麻纤维间的氢键暂时松开，重力把衣服拉直
    3. 它不是靠压力压平；这集只讲松皱，不把杀菌当原理

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #挂烫机原理 #蒸汽松皱 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：挂烫机靠什么把褶皱松开。
      很多人以为，它是立起来的电熨斗。
      靠刷头使劲，把布压平。
      其实压力不是主角。
      水在机身里烧开，变成蒸汽。
      蒸汽喷到织物上，再凝成小水滴。
      热和水分一起到，纤维会暂时变软。
      衣服挂着，重力把它们拉直。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      水箱把水送到加热腔。
      加热腔像一只小水壶。
      它把水烧开，变成蒸汽。
      多数家用是常压，蒸汽靠近一百度。
      蒸汽沿着软管，升到喷头。
      喷头上的小孔，把蒸汽散开。
      刷毛只是让蒸汽贴住布，并不靠死压。
      真正要松开的，是织物里的纤维。
      棉和麻的纤维之间，有一些临时连接。
      很多是氢键。
      你可以把它理解成互相牵住的小手。
      热蒸汽一来，这些小手松开。
      衣服垂着，纤维回到比较直的位置。
      冷却变干以后，小手重新牵上。
      褶皱就留在新的形状里。
      有些化纤的褶，是热定型压出来的。
      蒸汽不一定能完全打开。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：褶皱怎么松开？
      第一步，加热腔把水烧成蒸汽。
      第二步，蒸汽沿软管到达喷头。
      第三步，蒸汽碰到比较凉的衣服。
      它放出热量，同时凝成水。
      纤维吸进热，也吸进一点水分。
      纤维暂时变软，形状可以改。
      第四步，衣服挂直，重力帮它拉平。
      你慢慢移动喷头，让蒸汽刚好走过。
      然后让布变干，新形状就留住了。
      喷头离布太远，蒸汽中途就散了。
      所以要贴近，但不必死死压住。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么挥两下，褶还在？
      蒸汽没有在布上停留够久。
      热和水分，都没进到纤维里。
      为什么它压不出锋利的裤线？
      裤线要靠烫板，加上底板的压力。
      挂烫几乎不施压，只是把衣服拉直。
      为什么用久了，蒸汽变小？
      水垢窄了加热腔里的水路。
      和水壶一样，要按说明清理。
      它也不是一台消毒柜。
      家用喷头在一块布上停留很短。
      这集只讲怎么松褶皱。
      不把杀菌当成它的原理。
      一句话：蒸汽送去热和水，重力把衣服拉直。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：蒸汽松开纤维。
      挂着的衣服，靠重力拉直。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆电动牙刷，还是换个别的家电？评论区告诉我。
