douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解电烤箱
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：电烤箱。

    本集拆解：
    1. 电热管通电发热，不是旋钮越大管越一直更烫
    2. 烧烤靠上管辐射，热风靠风扇搅匀热空气
    3. 温控器到温就停管，温度在设定值附近开关

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #电烤箱原理 #热风对流 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：电烤箱是怎么把食物烤熟的。
      很多人以为，旋钮拧大，烤管就一直更烫。
      其实常见家用烤箱，烤管要么满功率，要么断电。
      管温度的是温控器。
      到了设定温度，它就让烤管停一停。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      上方是上电热管，管里是电阻丝。
      通电后电阻发热，管壁又烫又辐射。
      下方是下电热管，烘烤时加热腔底和空气。
      热风款的后壁有风扇。
      风扇旁边，常常再绕一圈加热管。
      感温头把腔温告诉温控器。
      门封把热气留在腔里。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：热怎么进到食物里？
      第一步，电热管通电，电阻把电变成热。
      管壁升温，向外发出红外辐射。
      第二步，辐射烤到表面，也加热附近空气。
      热空气变轻上升，这是自然对流。
      第三步，烧烤主要靠上管近距离辐射。
      表面先上色，厚食材里面未必熟。
      第四步，打开热风，风扇把热空气搅匀。
      它吹薄表面那层凉空气，受热更匀更快。
      温控器到温就切断烤管，掉温再接通。
      腔温在设定值附近来回晃，不是直线。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么要预热？先把腔壁和空气带热。
      食物放进去，才按这个温度开关烤管。
      为什么烧烤容易外糊、里面不熟？
      上管辐射很猛，热量先停在表面。
      热风用流动空气补上这一块。
      为什么热风档常常可以略降温度？
      风扇让每一面都碰到热空气，传热更快。
      食谱上的温度，是按模式写的。
      一句话：电热管发热，温控器开关。
      烧烤偏辐射，热风偏强制对流。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：电热管发热，温控器开关。
      烧烤靠辐射，热风靠风扇。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆电热水壶，还是换个别的家电？
      评论区告诉我。
