douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解电动晾衣架
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：电动晾衣架。

    本集拆解：
    1. 电机转动卷轴，钢丝绳变短，衣杆被拉高
    2. 绳子收到限位，电机停下
    3. 风扇只拨空气。衣服上的水还是靠空气离开

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #电动晾衣架原理 #电机收绳 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：电动晾衣架靠什么把衣杆升起。
      很多人以为，衣杆自己会往上升。
      或者它能像干衣机一样把水烘干。
      其实主机里有一只电机。
      电机带着卷轴转。
      钢丝绳绕上卷轴，衣杆就被拉高。
      要降下来，电机反转，绳子放长。
      收到头，限位开关把电断开。
      衣服上的水，还是靠空气慢慢离开。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      天花板里的主机，有一只电机。
      电机不直接托着衣杆。
      它转动旁边的卷轴。
      卷轴上绕着钢丝绳。
      你可以把它理解成在往上收绳子。
      绳子下头拴着衣杆。
      绳子变短，衣杆上升。
      绳子放长，衣杆下降。
      杆的两头都有钢丝绳。
      两头一起收，杆才不会歪。
      两头绳差一截，杆就会歪。
      卷轴收到头，有个限位开关。
      开关让电机停下。
      停的是继续转，不是把衣服烤干。
      有的机器带着小风扇。
      风扇只是拨动空气。
      它没有干衣机里的加热滚筒。
      遥控只是告诉电机转还是停。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：衣杆怎么升上去？
      第一步，让电机正转。
      电机只负责转，不负责托衣服。
      第二步，卷轴把钢丝绳绕上去。
      绳子一圈圈变短。
      第三步，衣杆被绳子拉高。
      衣服跟着杆离开地面。
      绳子长度不变，杆就停住。
      第四步，绳子收到上限位。
      开关断开，电机不再转。
      要下来，电机反转放绳。
      放到底，下限位同样让它停。
      说白了，升的是收绳，不是衣杆会飞。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么升到顶会自己停？
      绳子收到了限位。
      开关把电机的电断开。
      没有这个停，绳子会一直绞。
      为什么有时升着就停住？
      衣服太重，或者绳子被卡住。
      电机转不动，保护就会断电。
      它停的是转不动，不是判断衣服干了。
      为什么挂上去不会马上干？
      这台机器不把水收进盒子里。
      空气把水慢慢带走。
      风扇只是让空气多走一点。
      这集不讲遥控品牌。
      一句话：电机收绳，衣杆才上升。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：电动晾衣架在收绳子。
      限位一到，电机就停下。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆除螨仪，还是换个别的家电？
      评论区告诉我。
