douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解冲牙器
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：冲牙器。

    本集拆解：
    1. 小水泵一下一下，把水箱里的水推出细喷嘴
    2. 脉冲只打到水够得着的空隙
    3. 调高挡是推得更用力。这集不把功效当成结论

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #冲牙器原理 #脉冲水流 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：冲牙器靠什么把碎屑冲走。
      很多人以为，它靠超声波隔空洗牙。
      或者水压调大，牙缝就一定更干净。
      其实主角是一只小水泵。
      水泵把水箱里的水推出去。
      喷嘴很细，水变成一股一股。
      这一股打到水能到达的地方。
      碰得着的松散碎屑，会被水推开。
      更窄的缝，这股水不一定进得去。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      机身下面是水箱。
      里面盛的是普通的水。
      水箱连着一只小水泵。
      泵一伸一缩，就把水推一截。
      你可以把它理解成在挤水的小活塞。
      它不是在发隔空的声波。
      前面接一根细喷嘴。
      口很小，同样的水挤得更快。
      泵一下，喷嘴吐出一股。
      再一下，又吐出一股。
      脉冲之间，会短暂停一下。
      所以看见的是一股一股，不是不断的细线。
      挡位改的是泵推得多用力。
      不是换成另一种水。
      水箱空了，泵没有水可推。
      电动牙刷靠刷毛去刮。
      冲牙器这一集，不靠刷毛。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：碎屑怎么被冲开？
      第一步，水箱里得先有水。
      水泵开始一伸一缩。
      每一缩，都把水推出去。
      第二步，水挤过那根细喷嘴。
      口小，这一股就更冲。
      第三步，水打到它够得着的缝。
      松散碎屑跟着水离开。
      第四步，水从嘴边流走。
      带不走的，是水没碰到的那些。
      调高挡，只是这一股更冲。
      更冲，也不等于每条缝都进得去。
      说白了，它推的是水，不是刷毛。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么它是一股一股的？
      泵在一下一下地推。
      每一推，喷嘴才吐出一股。
      为什么调高了更容易溅？
      同样的细口，水被推得更快。
      打到牙面上，会反弹回来。
      溅出来，不代表缝里都到过。
      为什么有的缝还留着东西？
      水只会走它挤得进去的空隙。
      比这股水更窄的地方，水过不去。
      过不去，就不是那里被冲过了。
      这集只讲水怎么被推出去。
      不把某一种功效当成结论。
      一句话：脉冲把水推出，够得着才冲得走。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：冲牙器推的是水。
      水打到的地方，碎屑才可能被带走。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆电动晾衣架，还是换个别的家电？
      评论区告诉我。
