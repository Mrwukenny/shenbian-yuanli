douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解电热毯
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：电热毯。

    本集拆解：
    1. 一根电热丝铺开，电流挤过去就发热
    2. 低挡是少通一会儿，不是换一根更凉的丝
    3. 叠着通电，热会堆在一处。感温线是为了断电

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #电热毯原理 #电热丝 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：电热毯靠什么发热，又怎么停。
      很多人以为，毯子里藏着很多小炉子。
      或者低挡，就是换了一根更凉的丝。
      其实发热的是一根电热丝。
      它在夹层里弯弯曲曲铺开。
      电流挤过这根丝，挤出的就是热。
      控制器决定它通电多久。
      低挡只是通电更短，停得更久。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      毯子夹层里有一根电热丝。
      丝不是只铺在一个点上。
      它弯来弯去，走过整张毯。
      热就跟着这一片铺开。
      铺开以后，热不堆在一个点上。
      你可以把它理解成一条发热的线。
      线贴着布，布再把热传到身上。
      线的一头接着控制器。
      控制器不换丝。
      它只决定通电，还是暂停。
      低挡通电的时间短。
      高挡通电的时间长。
      高挡不是更烫的另一根丝。
      新一些的毯子，丝旁有感温线。
      它沿途看着这一段热不热。
      堆得太热，控制器就断电。
      这是为了停，不是为了叠着开。
      铺开用，热才散得走。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：热怎么铺开，又怎么停？
      第一步，电热丝通上电。
      电流挤过这根丝，丝就发热。
      第二步，丝铺成一整片。
      热散到毯子上，不堆在一点。
      第三步，布把热传到床上。
      你感到暖，是这一片在传热。
      第四步，控制器让它停一会儿。
      暂停的时候，丝几乎不发热。
      温度下来，再通电。
      低挡停得更久。
      高挡停得比较少。
      叠在一起，热就散不走。
      说白了，同一根丝，通电时间不同。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么低挡没那么热？
      还是那根电热丝。
      只是通电更短，暂停更长。
      为什么拔掉以后还暖？
      拔掉以后，丝就不再通电。
      丝已经不再发热。
      布和床垫里还存着刚才的热。
      热要慢慢散掉。
      为什么不能叠着通电？
      几段丝靠在一起。
      热散不出去，会堆在一处。
      感温线可以让它断电。
      它负责断电，不代表可以叠着开。
      这集只讲热从哪来，怎么停。
      一句话：同一根丝铺开，通电久才更热。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：电热丝铺开才发热。
      低挡是少通一会儿，不是另一根丝。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆智能门锁，还是换个别的家电？评论区告诉我。
