douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解电蒸锅
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：电蒸锅。

    本集拆解：
    1. 底下的水烧开，蒸汽从蒸格的孔往上走
    2. 蒸汽在更凉的食物上变回水，同时把热交出去
    3. 盖子不密封加压。水干断电是防干烧，不是判断熟了

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #电蒸锅原理 #蒸汽凝结 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：电蒸锅靠什么把食物蒸熟。
      很多人以为，它就是开了孔的电饭煲。
      或者盖子一盖，就变成压力锅。
      其实锅没有被密封加压。
      底下一层水被烧开。
      蒸汽往上走，穿过蒸格的孔。
      食物搁在水面上方。
      蒸汽碰到更凉的食物，会变回水。
      变回去的时候，把热带给食物。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      最下面是加热盘。
      它只负责把水烧热。
      盘子上面盛着一层水。
      水开了，才有蒸汽往上走。
      你可以把它理解成一壶烧开的水。
      蒸格负责把食物和水隔开。
      这层水不漫过上面的食物。
      蒸格底部有许多小孔。
      蒸汽就从这些孔里上去。
      食物搁在孔的上面。
      盖子边上留着一条缝。
      多余的蒸汽从缝里离开。
      它不是压力锅那种锁盖。
      蒸汽没有被关在锅里加压。
      水烧干以后，有的锅会断电。
      那是盘底太烫，在保护自己。
      断电停的是干烧。
      不是它量过食物已经熟了。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：食物怎么被蒸熟？
      第一步，加热盘把水烧开。
      水变成蒸汽，往上走。
      第二步，蒸汽穿过蒸格的孔。
      液态的水并不泡着食物。
      第三步，蒸汽碰到更凉的食物。
      它变回小水滴，同时把热交出来。
      这个变回，就叫凝结。
      热从表面一层层往里面传。
      厚块的中心，要更久才热。
      第四步，多余蒸汽从盖缝离开。
      锅里温度停在水开附近。
      没有被加压到更高。
      说白了，熟的是蒸汽交出的热。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么蒸好的表面是湿的？
      蒸汽在食物上变回了水。
      湿的是凝结的水，不是从锅底漫上来的。
      为什么它通常比压力锅慢？
      盖子没有把蒸汽关死。
      水还是按普通烧开的温度在沸腾。
      温度上不去，所以要更久。
      为什么水干了会自己停？
      没有水可烧，盘底很快变烫。
      保护开关把电断开。
      它停的是干烧，不是判定熟了。
      这集不比营养，也不比品牌。
      一句话：蒸汽上来变成水，热交给食物。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：电蒸锅不加压。
      蒸汽变回水的时候，把热交出去。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆冲牙器，还是换个别的家电？
      评论区告诉我。
