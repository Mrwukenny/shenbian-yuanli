douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解咖啡机
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：咖啡机。

    本集拆解：
    1. 烘焙早就完成，机器是用热水把味道溶出来
    2. 滴滤把热水淋上去，半自动只是把水压过更细的粉
    3. 粉太细更容易苦，太粗更容易淡；纸滤拦渣，不拦咖啡因

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #咖啡机原理 #热水萃取 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：家用咖啡机怎么把味道带出来。
      很多人以为，机器把豆子烤香了。
      其实烘焙早就做完了。
      机器做的事很单纯。
      用热水，把粉里能溶的味道带出来。
      家用滴滤，是把热水淋上去。
      半自动多一个泵。
      水被压过更细的粉。
      道理仍是溶解，不是另开烘焙。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识滴滤机的几个主角。
      水箱里装的是冷水。
      冷水进加热管，烧热后再到花洒。
      花洒把热水淋开，别只冲一个点。
      滤杯里是咖啡粉，下面垫着纸滤。
      纸滤拦住细粉，让液体往下走。
      粉的粗细，决定两件事。
      表面积，还有水穿过的快慢。
      壶只是接住已经溶出的咖啡。
      家用半自动多一只泵。
      泵把水压过压实的细粉饼。
      接触更短，粉就要更细。
      这集不展开商业意式的整套手法。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：味道怎么进杯子？
      第一步，冷水进加热管，变成热水。
      比较合适的是九十度上下。
      第二步，热水淋到粉上。
      能溶的酸、苦和香气进到水里。
      第三步，纸滤拦住细粉，咖啡液滴进壶。
      第四步，看水在粉里停留多久。
      粉太细，水走得慢，更容易发苦。
      粉太粗，水一穿而过，淡，也常偏酸。
      浓淡常常是时间和粗细。
      不是旋钮在烤豆子。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么同一款豆，有时酸有时苦？
      常常是粗细和水停留的时间变了。
      不是机器突然改了烘焙。
      为什么要定期除垢？
      水垢窄了加热水路。
      出水量和温度都会飘。
      为什么纸滤去不掉咖啡因？
      咖啡因溶于热水，会跟着液体走。
      纸滤拦的是细粉，不是咖啡因。
      很多浓淡键，调的是过水节奏或水量。
      不是另外一根更烫的管子。
      一句话：热水溶解，纸滤拦渣。
      粗细决定水走多快。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：热水把味道溶出来。
      粗细决定水走多快。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆扫地机器人，还是换个别的家电？评论区告诉我。
