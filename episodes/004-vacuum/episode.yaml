  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解吸尘器
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：吸尘器。

    本集拆解：
    1. 吸尘器不是「魔法吸力」
    2. 风扇、气压差、滤网怎么配合
    3. 为什么堵了会变弱、滤芯很重要

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #吸尘器原理 #气压差 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：吸尘器是怎么把灰尘吸起来的。
      很多人以为，吸尘器像一张大嘴，凭空产生吸力把东西拽进去。
      其实不是。
      它真正做的事是：在机器内部制造低压区，让外面的大气压把空气和灰尘一起「推」进来。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      核心是高速电机带着风扇转，把腔内空气往外抽。
      空气从吸嘴、软管进机身，先经过尘杯或尘袋把大颗粒拦住。
      再经过滤芯过滤细尘，干净空气从排气口排出。
      地刷上的滚刷负责拍打地毯和缝隙，把藏着的灰尘掀起来，方便气流带走。
      密封圈也很关键：哪里漏风，吸力就在哪里打折。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：吸力从哪来？
      第一步，风扇高速旋转，把机内空气往外甩，腔内气压下降。
      第二步，外面大气压更高，空气就从吸嘴涌入，形成高速气流。
      第三步，灰尘跟着气流走；尘杯用离心或滤网把颗粒甩下来、拦下来。
      第四步，更细的粉尘被滤芯拦住，避免再次吹回房间。
      所以吸尘器吸的不是「真空魔法」，而是气压差驱动的空气搬运。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个常见现象。
      为什么尘满了吸力变弱？通道堵了，气流上不去，气压差维持不住。
      为什么滤芯要定期清或换？滤芯堵了等于把排气口掐住，电机白转还易过热。
      为什么吸嘴贴死地面反而吸不动？进气口被堵死，没有空气流动，灰尘就带不走。
      一句话：气流才是搬运工，气压差才是动力。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：风扇抽气造低压，大气压把灰推进来，尘杯滤芯层层拦。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想拆冰箱、吹风机，还是抽油烟机？评论区告诉我。
