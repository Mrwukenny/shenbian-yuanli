douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解台灯
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：台灯。

    本集拆解：
    1. 电流顺着发光芯片通过，一部分能量变成光
    2. 金属把多余的热带走，灯罩把点光散开
    3. 调光多半是快闪或减小电流。护眼二字不是医疗结论

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #台灯原理 #发光芯片 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：台灯靠什么把电变成光。
      很多人以为，里面还是一根烧红的细丝。
      或者罩子上写着护眼，光就有了医疗作用。
      其实常见的是一颗发光芯片。
      电流顺着芯片认的方向通过。
      能量里的一部分，直接变成光。
      驱动负责把这个电流稳住。
      灯罩再把这一点光散开。
      罩上那行字，这集不当成眼睛的结论。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      灯头里有一颗很小的芯片。
      电流只能顺着它认的方向过。
      通过的时候，一部分能量变成光。
      你可以把它理解成一扇只往一边开的门。
      反着来，电流过不去，芯片也不亮。
      芯片旁边贴着一块金属。
      金属把多余的热带走。
      光出来了，热并没有完全消失。
      再前面是驱动。
      驱动不发明新的光。
      它把电流维持在芯片能接受的大小。
      最外面是灯罩。
      芯片几乎是一个小点。
      灯罩把这个点散成一片。
      调光多半是让它快闪。
      或者把电流减小。
      芯片还是同一颗。
      快闪快到眼睛分不出灭。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：桌面上的光怎么来？
      第一步，驱动送出稳定的小电流。
      第二步，电流流过这颗芯片。
      芯片放出光。
      第三步，金属把芯片上的热带走。
      灯壳会暖，但不是细丝烧红。
      第四步，灯罩把点光散开。
      桌上看到的是一片，不是一个刺点。
      亮度调低，不用换芯片。
      要么亮的时间变短，要么电流变小。
      说白了，电过芯片，才有这盏光。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么灯壳是暖的，却不像老灯泡烫？
      老灯泡靠细丝烧热来发光。
      这颗芯片把更多能量交成光。
      剩下的热，由金属散走。
      为什么调暗了，颜色常常不变？
      还是同一颗芯片在发光。
      变的是亮多久，或者电流多大。
      为什么拿掉灯罩会刺眼？
      光从很小的一点发出来。
      没有罩子，这一点就直对着眼睛。
      罩子是在把光散开。
      不是在治疗眼睛。
      这集不把护眼两个字讲成医疗效果。
      一句话：电流过芯片发光，灯罩负责散开。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：台灯里是芯片在发光。
      灯罩把点光散开，护眼二字不是结论。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆哪一件？评论区告诉我。
