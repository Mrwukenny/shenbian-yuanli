douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解冰箱
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：冰箱。

    本集拆解：
    1. 冰箱不是往里「灌冷气」
    2. 压缩机、蒸发器、冷凝器怎么配合
    3. 为什么后背会热、门封条很重要

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #冰箱原理 #制冷循环 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：冰箱是怎么让食物保持低温的。
      很多人以为，冰箱在里面制造冷气，像空调往里喷凉。
      其实思路更像空调：它不生产冷，而是把箱子里的热带走。
      热量被搬到箱外，里面自然就变凉了。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      箱内壁附近是蒸发器，制冷剂在这里吸热变气。
      箱后或底部是压缩机，把气态制冷剂压紧推走。
      箱背后那排散热管是冷凝器，负责把热带到空气里。
      门封条也很关键：密封不好，冷气漏、热气进，电机就得更拼命干活。
      冷冻室更冷，是因为蒸发温度和风道分配不同，不是两套魔法。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：热量怎么搬家？
      第一步，液态制冷剂在蒸发器里吸热蒸发，箱内热量被带走。
      第二步，压缩机把气体压成高温高压。
      第三步，热气体流经冷凝器，把热量交给箱外空气，自己冷凝成液体。
      第四步，经节流降压后再回蒸发器，循环继续。
      和空调是同一套四步曲：压缩、冷凝、节流、蒸发。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么冰箱后背烫？那是热量出口，说明循环在干活。
      为什么塞太满降温慢？空气对流受阻，换热变差。
      为什么门老开费电？等于一直在给箱内加热，压缩机频繁启动。
      一句话：冰箱是小型热量搬运站，冷是搬空热之后的结果。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：箱内吸热，箱外放热，压缩机当队长。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想拆电饭煲、热水器，还是路由器？评论区告诉我。
