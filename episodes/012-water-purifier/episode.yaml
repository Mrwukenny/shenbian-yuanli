douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解净水器
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：净水器。

    本集拆解：
    1. TDS低，不等于水更安全
    2. PP棉拦颗粒，活性炭去余氯，增压泵把水压过反渗透膜
    3. 浓水是在冲膜，滤芯要换是因为堵住、吸满或膜不行了

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #净水器原理 #反渗透 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：净水器是怎么处理自来水的。
      很多人以为，TDS越低，水就越安全。
      其实TDS只是溶解物导电的粗测。
      它测不出细菌，也测不出很多不带电的污染物。
      常见家用机是分级拦截，再用压力把水挤过很密的膜。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      第一级多是PP棉，细纤维拦住泥沙和锈渣。
      接着是活性炭。它除掉余氯，也吸附一部分异味。
      余氯要先去掉，不然会氧化后面的反渗透膜。
      增压泵把压力打高。自来水常常压不过那层膜。
      反渗透膜很致密。水在压力下过去，大部分溶解的盐过不去。
      过不去的盐，要靠浓水带走。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：水是怎么被分开的？
      第一步，水穿过PP棉，泥沙和锈渣卡在纤维里。
      第二步，活性炭处理余氯。空位坐满了，氯就会漏过去。
      第三步，增压泵加压。膜两边一浓一淡，水本来想去冲淡浓的那边。泵把压力打得更高，水才反过来过去。
      第四步，过去的是净水。留下的盐被浓水冲走，免得糊在膜上。
      超滤孔更大。细菌和胶体过不去，溶解的盐过得去，所以TDS几乎不变。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么滤芯要换？棉会堵住，炭会吸满，膜会结垢，或者被漏过来的余氯伤到。
      为什么TDS低不等于安全？它只看溶解离子多少。矿泉水的TDS可以不低，有些污染物却几乎不抬这个数。
      为什么要排浓水？那是在冲膜，不是白流掉的脏水。一份净水旁边，常见还有一份到几份浓水。比例看膜和水压，不是安全分数。
      反渗透会去掉大部分矿物质，口感变淡。吃得正常的人，矿物质主要来自食物。把它说成伤身，或者说TDS越低越健康，都超出了证据。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：PP棉拦渣，活性炭去氯，泵压过膜，浓水冲盐。
      TDS不是安全成绩单。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆电烤箱，还是换个别的家电？评论区告诉我。
