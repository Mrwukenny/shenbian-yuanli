  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解微波炉
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：微波炉。

    本集拆解：
    1. 微波炉不是用热风烤食物
    2. 磁控管、波导、腔体怎么配合
    3. 为什么金属会打火、冰块难热

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #微波炉原理 #磁控管 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：微波炉是怎么把食物加热的。
      很多人以为，微波炉像小烤箱，用热风或热辐射把外面烤热。
      其实不是。
      它几乎不加热空气，而是让食物里的水分子自己「跳舞」发热。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      侧边或顶部那块核心零件叫磁控管，专门制造微波。
      微波经波导管送进腔体，像被引导进房间的电磁波。
      腔体金属壁会把微波反弹回来，来回乱撞，把能量留给食物。
      转盘负责慢慢转，让加热更均匀。
      门上那层金属网也不是摆设：网眼比波长小，微波出不去，光线能进来，所以你看得见，又挡得住。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：水分子怎么被加热？
      微波大约每秒振荡二十四点五亿次。
      水分子是极性分子，一头偏正、一头偏负，会跟着电场来回翻转。
      分子互相摩擦、碰撞，宏观上就是温度上升。
      所以含水量高的食物通常热得快：粥、汤、剩菜里的水，才是真正的「发热主力」。
      微波能穿透食物表层几厘米，内外一起晃，这和烤箱只从外往里烤，完全不是一回事。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个常见现象。
      为什么不能放金属？金属会反射甚至打火，危险又伤机器。
      为什么冰块有时热得慢？冰里的水分子被冻住，不好跟着翻转。
      为什么有时外热里凉、或边缘更烫？形状、水分分布和驻波叠加，会让能量落点不均匀。
      一句话：微波炉加热的是能跟着电场晃的分子，不是均匀地「烤空气」。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：磁控管产波，腔体反弹，水分子跳舞，食物就热了。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想拆冰箱、电磁炉，还是空气炸锅？评论区告诉我。
