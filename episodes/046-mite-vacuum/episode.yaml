douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解除螨仪
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：除螨仪。

    本集拆解：
    1. 拍打垫敲松表面浮灰，风扇让空气把灰带进滤网
    2. 紫外灯只照到光打到的那一块表面
    3. 滤网变灰，不等于填充层已经被清空。这集不讲除螨功效

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #除螨仪原理 #表面拍打 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：除螨仪的拍打和吸力在哪一层。
      很多人以为，紫光一照，床垫深处就处理完了。
      或者吸一遍，整张床就都干净了。
      其实先碰到的是表面。
      拍打头敲松这一层的浮灰。
      风扇把机头里的气压降低。
      外面的空气涌进来，把浮灰带进去。
      滤网拦住空气带来的那些。
      灯光只照到它照得着的表面。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      机头下面是一块拍打垫。
      它一下一下敲在织物表面。
      敲的是这一层，不是把填充掏出来。
      旁边是风扇。
      风扇一转，机头里面气压变低。
      你可以把它理解成和吸尘器同一件事。
      外面的空气，把松开的灰推进去。
      进气的路上有一层滤网。
      灰留在网上，空气穿过去。
      有的机头还亮着一盏紫外灯。
      你看见的紫光，就是这盏灯。
      光沿直线走。
      厚布和填充会把光挡住。
      灯照不到被挡住的那一层。
      有的机头贴着会发热。
      热也只暖到贴着的这一面。
      亮灯不等于深处已经处理完。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：表面的灰怎么离开？
      第一步，拍打垫敲在布面上。
      浮着的灰被敲松。
      第二步，风扇把里面的气压降低。
      外面的空气只好往里涌。
      第三步，空气带着松动的灰进入机头。
      贴得很紧、又没被敲松的，带不走。
      第四步，滤网把灰留下。
      网上的灰，是空气带来的。
      它不是一张深处的清单。
      这一层下面，气流到不了。
      紫外灯如果亮着，只照灯下这一小块。
      说白了，拍打和气流都在表面。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么滤网会变灰？
      那是空气带进来的浮灰。
      变灰说明表面有东西被带出。
      不能据此说填充里已经空了。
      为什么灯亮着，被单底下还是暗的？
      光过不了厚厚的布和棉。
      亮的是灯下那一块表面。
      为什么推很久，床垫还是原样？
      机器没有拆开填充。
      它到不了被布包住的那一层。
      这集只讲拍打、气流和光的范围。
      不把除螨效果当成结论。
      一句话：能带走的是表面的灰。
      深处不在这集的结论里。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：拍打和吸力在表面。
      灯光过不了厚布。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆台灯，还是换个别的家电？
      评论区告诉我。
