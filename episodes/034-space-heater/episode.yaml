douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解电暖器
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：电暖器。

    本集拆解：
    1. 油汀里的油不燃烧，只把电热管的热传到散热片
    2. 空气贴着片变热，自己上升。小太阳用红外线先烤人和家具
    3. 油不会越用越少。对着小太阳才暖，是因为射线差不多走直线

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #电暖器原理 #油汀对流 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：电暖器靠什么让房间变暖。
      很多人以为，油汀里面的油会烧掉。
      或者小太阳和油汀，是同一种热。
      其实油被封在管子里。
      电热管把油加热。
      油再把热带到散热片上。
      油不会烧完。
      小太阳走另一条路。
      灯管发出红外线，先烤到人和家具。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      两种机器，都有电热管。
      电把电热管烧热。
      它们不烧煤，也不烧气。
      油汀里面，有密封的导热油。
      油不负责燃烧。
      它只是把热从电热管，搬到金属片上。
      散热片的面积大。
      凉空气贴着片，被烤热。
      热空气比较轻，自己往上走。
      房间就慢慢暖起来。
      这种油汀，通常没有风机。
      小太阳的主角，是一根灯管。
      后面有一面反射罩。
      灯管发出红外线。
      反射罩把射线往前送。
      射线穿过空气。
      打到人和沙发上，才变成热。
      你面对着它，会先觉得暖。
      背后的空气，可以还是凉的。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：热怎么进到房间？
      第一步，先看你开的是哪一种。
      油汀靠散热片。小太阳靠红外线。
      第二步，电热管通电，开始发热。
      油汀里，热传给密封的油。
      第三步，油把一片片散热片烤热。
      空气贴着片变热，再向上漂。
      第四步，换到小太阳。
      灯管射出红外线，打到人和家具。
      油汀几乎不发光。
      它暖的是空气。
      小太阳对着才暖。
      背过去，那一侧还没被射线打到。
      所以一个先加热空气，一个先加热人和物。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么油汀不发红，房间也会暖？
      它在加热贴着散热片的空气。
      热空气自己上升，不靠发光。
      为什么小太阳面对着才暖？
      红外线差不多走直线。
      反射罩没送到的地方，还是凉的。
      为什么油不会越用越少？
      油不参与燃烧。
      它被封在里面来回传热。
      只有漏了，油才会少。
      这集只讲热怎么送出来。
      不比较哪一种更省电。
      一句话：油汀加热空气，小太阳烤到人和物。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：油汀先加热空气。
      小太阳的红外线，先烤到人和物。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆投影仪，还是换个别的家电？评论区告诉我。
