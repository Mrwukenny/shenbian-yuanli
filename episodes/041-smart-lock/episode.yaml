douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解智能门锁
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：智能门锁。

    本集拆解：
    1. 锁舌仍是机械的，对上了小电机才把它收回
    2. 指纹读的是纹路高低，比对发生在锁里面
    3. 没电时锁舌保持伸出。远程开锁这集不讲

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #智能门锁原理 #锁舌电机 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：智能门锁靠什么把锁舌收回。
      很多人以为，它已经没有锁舌了。
      或者电池一没电，门就会自己弹开。
      其实锁舌还是机械的。
      平时就伸在门框里。
      指纹或密码，先在锁里面比对。
      对上了，小电机才转动。
      电机把锁舌拉回来。
      对不上，锁舌停在外面。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      门边伸出的那根，是锁舌。
      它卡住门框，门就打不开。
      锁里面有一只小电机。
      电机负责把锁舌拉回来。
      电机只负责拉，不负责认出你。
      外面有一块指纹头。
      它读的是纹路的高低。
      高处和低处，信号不一样。
      不是拍一张彩色照片。
      你可以把它理解成在对形状。
      对上了，才给电机通电。
      密码和卡片是另一条入口。
      比对的东西不同。
      最后拉动的，仍是这根锁舌。
      旁边还有钥匙孔。
      钥匙直接转锁舌，不经过电机。
      电池没了，电机没有电。
      锁舌就保持伸出，不会自己缩回去。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：怎样才把锁舌收回？
      第一步，手指按上指纹头。
      纹路被读下来。
      第二步，锁里面做比对。
      和存下的对得上，才算认出你。
      第三步，小电机通电转动。
      它拉动锁舌往回走。
      第四步，锁舌离开门框。
      门这才能打开。
      对不上，电机不转。
      锁舌仍卡在外面。
      指纹和密码，比对就在锁里。
      家里没网，锁里照样能比对。
      远程开锁，这集不讲。
      说白了，对上才转，转的是电机。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么家里没网，指纹也能开？
      比对存在锁里面。
      网断了，锁内还是能对上。
      为什么湿手容易失败？
      水把纹路的高低弄糊了。
      湿手失败，是这一次没读清。
      读不清，不是把你从锁里删掉。
      为什么电池没了，门还锁着？
      电机没有电，拉不动锁舌。
      锁舌停在锁住的位置。
      对不上的时候，门框仍被锁舌卡住。
      钥匙仍能转同一根锁舌。
      这集不讲远程，也不讲品牌。
      一句话：对上了，电机才把锁舌收回。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：比对发生在锁里面。
      对上了，电机才把锁舌收回。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆电视，还是换个别的家电？评论区告诉我。
