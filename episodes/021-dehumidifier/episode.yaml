douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解除湿机
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：除湿机。

    本集拆解：
    1. 冷排低于露点，水蒸气凝成水，滴进水箱
    2. 热排在室内，所以除湿时往往吹出热风
    3. 天冷时冷排容易结霜；转轮式靠干燥剂和加热

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #除湿机原理 #冷凝除湿 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：除湿机靠什么把水拿出来。
      很多人以为，它把湿气吸进海绵。
      或者把房间吹凉快。
      其实常见的压缩式不是这样。
      空气吹过冷排，水蒸气变成水滴。
      水滴流进水箱。
      热排还在室内。
      所以房间往往会更暖一点。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      风扇让空气先过冷排，再过热排。
      压缩机推动制冷剂循环。
      你把它理解成运热的搬运工。
      冷排吸热，热排放热。
      这里不展开相变公式。
      空气冷到一定程度，水蒸气会成水。
      这个温度叫露点。
      冷排要低于露点，才会结水。
      水滴进水箱。
      浮子满了就停机。
      进风滤网只挡灰尘。
      免得冷排糊住，它并不拿水。
      还有一种转轮式。
      干燥剂先吸水，再加热把水赶出来。
      室温低、冷排爱结霜时，它更不容易停。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：水怎么离开空气？
      第一步，风扇把湿空气抽过冷排。
      第二步，冷排低于露点，水蒸气凝成水。
      水进水箱，空气里的水变少。
      第三步，变干的空气再过热排。
      热排把热量送回房间。
      第四步，制冷剂回到冷排，冷排继续冷。
      水离开了空气，热量留在屋里。
      所以它除湿，不负责降温。
      空调不一样，热被排到室外。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么除湿时吹出的是热风？
      热排在室内。
      结水放出的热，加上压缩机的热，都回来了。
      为什么天冷几乎不出水？
      室温一低，冷排容易结霜。
      能凝结的水就变少。
      为什么水箱满了就停？
      浮子断开，避免水漫进电路。
      要一直排，就接排水管。
      多数靠重力，往低处流。
      一句话：冷排结水，热排留在屋里。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：冷排把水蒸气变成水。
      热留在房间里，它不负责降温。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆破壁机，还是换个别的家电？评论区告诉我。
