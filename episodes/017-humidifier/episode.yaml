douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解加湿器
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：加湿器。

    本集拆解：
    1. 超声波震出的是液滴，不是烧开的蒸汽
    2. 蒸发式吹出看不见的水蒸气，矿物质留在网上
    3. 自来水的钙镁会跟着液滴变成白灰

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #加湿器原理 #超声波雾化 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：加湿器的白雾到底是什么。
      很多人以为，看得见的白雾都是开水蒸汽。
      其实家用机常见两条路。
      超声波把水震成细小液滴，风扇吹出来。
      蒸发式让风穿过湿网，水变成水蒸气。
      水蒸气看不见。液滴会带走矿物质。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      水箱把水送到下面水槽，稳住水位。
      超声波的核心是一片压电陶瓷。
      高频电压让它每秒振动上百万次。
      水面起小波，波峰碎成很细的水滴。
      旁边的小风扇，只负责把液滴送出去。
      它不负责把水煮开。
      蒸发式没有这片陶瓷，它有吸水滤网。
      风扇把干燥空气吹过网面，水从表面蒸发。
      矿物质留在网上，所以网会结垢，要更换。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：两条路不是一回事。
      第一步，水进入水槽，压电片高频振动。
      第二步，振动把水面撕成细雾。
      这些雾是液体小水滴，不是气体。
      第三步，风扇把雾吹进房间。
      水滴之后蒸发，钙和镁变成白色粉末。
      粉末落在家具上，这就是白灰。
      第四步，换成蒸发式，风扇吹过湿网。
      水直接变成水蒸气，本身看不见。
      矿物质留在网上，所以很少有白灰。
      房间越潮，蒸发越慢。
      超声波只要有水、还在振，就会继续喷。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么超声波用自来水，桌面会起白？
      那是水滴里的矿物质，不是机器在喷粉。
      换纯净水，或加上除垢盒，白灰会少很多。
      为什么蒸发式几乎看不见雾，湿度却在升？
      水蒸气是气体，本来就透明。
      为什么水箱要勤洗？这两种都不靠煮水。
      水放久了，细菌有地方待。
      白雾只说明有水出来，不说明水是无菌的。
      一句话：超声波喷液滴，蒸发式送水蒸气。
      白灰是矿物质跟着液滴走了。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：超声波震出液滴，蒸发式出水蒸气。
      白灰来自矿物质。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆咖啡机，还是换个别的家电？评论区告诉我。
