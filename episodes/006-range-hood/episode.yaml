  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解抽油烟机
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：抽油烟机。

    本集拆解：
    1. 油烟机靠的是负压气流
    2. 叶轮、滤网、烟道怎么配合
    3. 为什么滤网油腻会变弱

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #抽油烟机 #负压 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：抽油烟机是怎么吸走油烟的。
      很多人以为，它只是头顶一个大风扇对着锅吹。
      其实关键是制造负压区：把灶台上方的空气抽走，油烟就跟着气流被带走。
      方向对了，油烟才不会先扑到你脸上。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      机腔内的离心叶轮高速旋转，把空气甩向烟道。
      进风口的油网先拦住大油滴，减少油污进入风机。
      烟道把油气混合物排到室外或公共烟道。
      集烟罩的形状很重要：它像漏斗，尽量把上升的热油气拢住再抽走。
      止回阀防止外面的味倒灌回来。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：油烟怎么走？
      炒菜起热，油气和蒸汽向上升。
      叶轮抽气，罩口附近形成低压，周围空气带着油烟涌入。
      大油滴撞在油网上凝结留下来；更细的雾滴随气流进风机、进烟道。
      最后从室外排出。所以要尽量让锅具落在有效吸烟区里，离得太远就吸不住。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么油网很脏就变弱？进风阻力大，风量掉，负压不够。
      为什么烟道太长、弯太多也弱？排气不畅，等于给风机加负担。
      为什么有时外面刮风会倒烟？外面气压变化，止回或密封不好就会倒灌。
      一句话：油烟机靠气流路径和压差吃饭，清洁和维护决定它能不能持续有劲。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：叶轮造负压，油网拦油滴，烟道送出屋。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想拆燃气灶、热水器，还是空气净化器？评论区告诉我。
