douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解电熨斗
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：电熨斗。

    本集拆解：
    1. 底板加热，水碰到热底板变成蒸汽，从小孔喷出
    2. 热和水松开纤维间的连接，底板压在烫板上把新形状定住
    3. 温控让底板停在设定温度。没有压力，就压不出裤线

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #电熨斗原理 #蒸汽压烫 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：电熨斗靠什么把褶皱压平。
      很多人以为，它只是一块很烫的铁。
      或者和挂烫机一样，喷点蒸汽就行。
      其实两件都差了一点。
      底板先被加热。
      水碰到热的底板，变成蒸汽。
      蒸汽从底板的小孔喷出来。
      热和水分，让纤维暂时变软。
      底板再压在烫板上。
      压力把新的形状定住。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      底板里面埋着电热丝。
      电热丝发热，底板跟着变烫。
      旁边有个温控。
      温度到了设定值，电路断开。
      底板凉一点，电路再合上。
      所以它是一会儿热，一会儿停。
      水箱里的水，滴到烫的底板上。
      水一下子变成蒸汽。
      蒸汽从底板上的小孔喷出。
      棉和麻的纤维之间，有一些氢键。
      你可以把它理解成牵在一起的小手。
      热和水一到，这些小手松开。
      烫板在下面，给底板当垫子。
      底板的压力，把松开的纤维压平。
      布离开热、变干以后，小手重新牵上。
      褶就留在新的位置。
      丝绸和化纤更怕高温。
      温控就是为了别超过布能受的热。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：褶皱怎么被压平？
      第一步，电热丝把底板加热到设定温度。
      第二步，水遇热变成蒸汽，从小孔喷出。
      纤维吸进热，也吸进一点水分。
      第三步，纤维暂时变软，原来的褶可以改。
      第四步，底板贴着烫板往前推。
      压力加上垫板，把布压成新形状。
      布凉下来，变干，形状就留住。
      没有蒸汽，有些棉布的褶很难打开。
      只有蒸汽、没有压力，又压不出裤线。
      所以是热、水和压力，一起工作。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么挂烫机能拉直，却压不出裤线？
      挂烫几乎不施压，靠衣服自己的重量。
      裤线要底板压在烫板上。
      为什么温度调太高，布会发黄？
      纤维能受的热有上限。
      温控没对上布料，热就过头了。
      为什么水箱有水，却不出蒸汽？
      底板还没热够，水变不成汽。
      先等底板到温，再按蒸汽。
      这集只讲怎么把褶压平。
      一句话：热和水松开纤维，压力定住新形状。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：热和水先松开。
      底板压在烫板上，褶才定住。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆豆浆机，还是换个别的家电？评论区告诉我。
