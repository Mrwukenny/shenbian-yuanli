douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解空调
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：空调。

    本集拆解：
    1. 室内机和室外机各自干什么
    2. 制冷剂四步循环
    3. 为什么室外机会烫

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #空调原理 #制冷剂 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：空调是怎么让房间变凉的。
      很多人以为，空调在制造冷气，像自来水一样往外喷凉。
      其实不是。
      它做的事更像搬家：把房间里的热，一点点搬到室外去。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识两个主角。
      挂在墙上的是室内机，负责吸收房间里的热。
      窗外那台是室外机，负责把热甩到外面。
      它们靠铜管连着，管子里跑的不是普通空气，而是制冷剂。
      你可以把制冷剂理解成专职搬运工，专门运热量。
      室外机里还有一个关键角色：压缩机。
      它像给气体打气的泵，负责推动整条搬运线不停转圈。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：搬运工怎么循环干活？
      记住四个动作就行：压缩、冷凝、节流、蒸发。
      第一步，压缩机把气态制冷剂压紧，它会变热、变高压。
      第二步，热气体来到室外机的冷凝器。
      风扇一吹，热量交给外面的空气，制冷剂自己冷凝成液体。
      第三步，液体经过节流阀，压力骤降，变得又冷又容易蒸发。
      第四步，冷液体进入室内机蒸发器，吸收房间热量，重新变成气体。
      气体再回到压缩机，下一轮搬家开始。
      就这样转圈，房间里的热被一点点搬走，你才会觉得越来越凉快。

  - id: analogy
    blender_scene: analogy
    narration: |
      所以你摸摸室外机出风口，往往会觉得烫。
      那不是空调坏了，那是热量的出口。
      说白了：空调不生产冷，它只是转移热。
      室内变凉快，是因为热被持续送到了屋外。
      这也解释了另一个现象：夏天室外机周围更热，整栋楼都在往外扔热量。

  - id: outro
    blender_scene: outro
    narration: |
      一句话记住：空调是热量搬运队，制冷剂是队员，压缩机是队长。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想拆冰箱、洗衣机，还是无线充电器？评论区告诉我。
