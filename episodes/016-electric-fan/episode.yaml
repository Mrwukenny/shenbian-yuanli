douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解电风扇
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：电风扇。

    本集拆解：
    1. 风扇几乎不降低室温，凉快来自皮肤散热和汗蒸发
    2. 罩极铜环或电容，让感应电机的磁场转起来
    3. 斜叶推空气，摇头靠蜗杆和连杆

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #电风扇原理 #感应电机 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：电风扇为什么会让人觉得凉快。
      很多人以为，风扇把房间温度吹低了。
      其实它几乎不制冷。
      电机转起来，还会多放出一点热。
      凉快是因为风加快皮肤散热。
      也加快了汗水蒸发。
      扇叶后面，多半是交流感应电机。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      中间是电机。交流电在定子里造旋转磁场。
      转子跟着这个磁场转。
      小风扇常用罩极电机。
      磁极上的铜环让一部分磁通滞后。
      磁场扫过磁极，转子才能起步。
      不少台扇和落地扇用电容运转电机。
      电容让两条绕组的电流错开相位。
      磁场才能转起来，也更有劲。
      扇叶是斜的，转起来沿轴向推空气。
      摇头通常不是第二台电机。
      电机轴上的蜗杆，用连杆把扇头推来推去。
      离合器分开，摇头就停。
      网罩挡住手指，不负责制造凉风。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：风是怎么来的？
      第一步，交流电进定子，磁场被做成旋转的。
      靠的是罩极铜环，或者那只电容器。
      第二步，转子里感应出电流，再受磁力。
      转子跟着转。这里没有电刷换向。
      第三步，扇叶跟着轮毂转，斜面把空气推向你。
      背后再补进新的空气。
      第四步，摇头齿轮啮合，连杆把风摆开。
      人觉得凉，是皮肤上的热空气被吹走。
      汗也蒸发得更快。
      房间里的温度计，不会因此往下掉。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么扇叶积灰会吵，风也变小？
      叶片不平衡，斜面也不干净，推空气就费劲。
      为什么有的风扇要配电容？
      电容运转电机的副绕组需要它。
      容量差太多，启动费劲，转速也不对。
      为什么空房间吹一夜，回来还是热？
      风扇没把热搬到室外。
      它只在你的皮肤上帮忙散热。
      一句话：感应电机转叶，摇头靠齿轮。
      凉快来自吹走热空气和汗。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：感应电机转叶，齿轮负责摇头。
      风扇不降低室温。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆加湿器，还是换个别的家电？评论区告诉我。
