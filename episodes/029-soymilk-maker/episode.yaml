douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解豆浆机
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：豆浆机。

    本集拆解：
    1. 刀片把泡软的豆子打碎，蛋白质和油脂进到水里
    2. 加热把浆煮到沸腾附近，防溢探针看到泡沫就暂停
    3. 没煮开的浆还不能喝。这集只讲打浆和煮熟

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #豆浆机原理 #打浆煮熟 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：豆浆机靠什么做出豆浆。
      很多人以为，它只是把豆子煮一煮。
      或者刀片一转，碎了就能喝。
      其实两步都要有。
      刀片在水里把豆粒打碎。
      蛋白质和油脂，进到水里。
      加热再把这杯浆煮开。
      没到沸腾附近，还不能当豆浆喝。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      杯底有一只小电机。
      电机带动刀片，在水里高速转。
      刀片切开泡软的豆子。
      豆细胞破了，里面的东西才进到水里。
      留下的粗纤维，就是豆渣。
      有的机器用网罩把渣拦住。
      有的把渣打得更碎，留在浆里。
      杯壁或杯底有加热管。
      它负责把浆烧热，直到沸腾附近。
      煮开不是为了冒泡好看。
      生豆里有一些怕热的成分。
      加热到沸腾附近，它们才失去作用。
      杯口有一根防溢探针。
      豆浆一煮，蛋白质会托住泡沫。
      泡沫碰到探针，加热先停一下。
      泡沫落下去，再继续把浆煮完。
      它是在看液面，不是在消灭泡沫。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：豆子怎么变成能喝的浆？
      第一步，豆子先泡软，再和水一起进杯。
      第二步，刀片转动，把豆粒切碎。
      蛋白质和油脂进到水里，浆变浑。
      第三步，加热管把浆烧到沸腾附近。
      要在这个温度停一会儿。
      不能只是冒一个泡就停。
      第四步，防溢探针看着泡沫。
      泡沫一顶到针，加热就暂停。
      浆落回去，再把剩下的热补完。
      豆渣是没进水里的那部分纤维。
      网罩把渣留下。没有网的，渣就留在浆里。
      说白了，刀片负责释放，加热负责煮熟。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么只打碎、不煮开，不能喝？
      刀片只是把内容物放进水里。
      没到沸腾附近，怕热的成分还在。
      为什么煮的时候会突然停一下？
      泡沫顶到防溢针，加热被暂停。
      这是在防溢锅，不是机器坏了。
      为什么豆子没泡，打出来很粗？
      干豆子硬，刀片切不开那么多细胞。
      泡软以后，同样的刀更容易切开。
      这集只讲打浆和煮熟。
      不讲甜咸配方，也不讲营养表。
      一句话：先打碎释放，再煮开才能喝。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：刀片把豆子打开。
      煮到沸腾附近，浆才算熟。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆面包机，还是换个别的家电？评论区告诉我。
