douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解饮水机
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：饮水机。

    本集拆解：
    1. 常见饮水机只加热一只小胆，整桶并不在烧
    2. 桶口被水封住，咕噜是空气补进去
    3. 连着接会变温。即热和制冷这集不展开

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #饮水机原理 #小胆保温 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：饮水机靠什么备着热水。
      很多人以为，按下热水才开始烧。
      烧的是桶里，或管子里的全部。
      其实整桶水并不在烧。
      只有一只小胆里有电热管。
      小胆平时就保温。
      你一接，出来的是已经热的水。
      常温那一路，不进这只小胆。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      常见的上面，倒扣着一只水桶。
      水不会一下子全掉下来。
      桶口被下面的水封住。
      流出一点，桶顶就空出低压。
      外面的气压，把其余的水托住。
      你一接水，空气就补进桶里。
      咕噜一声，就是这口气。
      管线机没有这只桶。
      水从管子进来，小胆还是有。
      小胆里才有电热管。
      你可以把它理解成一只小暖瓶。
      整桶水不经过这根电热管。
      热水龙头，接的是这只小胆。
      常温龙头，不进小胆。
      很多家用机器并不制冷。
      那一路是常温，不是冰水。
      即热式要等水流过才加热。
      这集讲的是小胆提前保温。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：接出来的是哪一杯？
      第一步，水补进那只小胆。
      第二步，电热管把胆里的水加热。
      热到了，就停一会儿。
      凉一点，再加热。这就是保温。
      第三步，按下热水龙头。
      出来的是胆里已经热的水。
      常温龙头从旁边走，不借小胆的热。
      不是此刻才把整桶烧开。
      第四步，热的被接走。
      桶里或管子里的凉水补进来。
      电热管还没把它重新加热。
      下一杯就会没那么烫。
      说白了，提前热着的是那一小胆。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么连着接，后面变温？
      小胆里能装的热水有限。
      凉水一补进来，温度就下来。
      不是龙头突然坏了。
      为什么水桶会咕噜响？
      空气要补进去，水才下得来。
      不是机器在往桶里打气。
      为什么常温水并不凉？
      很多机器只加热那一只小胆。
      另一个龙头，就是进来时的水温。
      即热式没有这只一直热的胆。
      保温是停了再热，不是整桶在翻滚。
      这集不讲制冷，也不讲滤芯。
      一句话：小胆提前保温，整桶并不在烧。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：电热管只加热小胆。
      整桶不烧，常温也不进这只胆。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆电热毯，还是换个别的家电？评论区告诉我。
