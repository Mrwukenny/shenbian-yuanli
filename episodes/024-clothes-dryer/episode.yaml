douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解干衣机
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：干衣机。

    本集拆解：
    1. 暖风把衣服里的水变成水蒸气，水并没有消失
    2. 排气式把湿气送走；冷凝和热泵把水蒸气重新结成水
    3. 热泵顺带回收热量，所以往往不必那么烫

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #干衣机原理 #冷凝烘干 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：干衣机靠什么把衣服烘干。
      很多人以为，它只是一台大热风机。
      热风一吹，水就消失了。
      其实水没有消失。
      暖空气把衣服里的水变成水蒸气。
      排气式把这股湿气送出室外。
      家里更常见冷凝式和热泵式。
      湿气碰到冷的表面，重新变成水。
      水进盒子，或者顺着管子排走。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      滚筒带着衣服不停翻。
      翻动是为了让褶皱里的水也见到风。
      风机推动空气穿过衣物。
      加热分两条路。
      电热丝直接把空气烤热。
      热泵则把热量从冷端搬到热端。
      你可以把它想成滚筒里的除湿机。
      冷盘管负责把水蒸气凝成水。
      热盘管再把干空气送回滚筒。
      热量被收回来，筒内往往不用那么烫。
      进风口有一层绒毛滤网。
      它拦住线屑，免得风路被堵住。
      水盒或排水管，接住凝出来的水。
      传感器看着衣服或出风还潮不潮。
      空气干了，程序就收尾。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：水怎么离开衣服？
      第一步，滚筒翻动，衣服展开。
      第二步，暖空气穿过织物。
      纤维里的水蒸发，变成水蒸气。
      第三步，看湿气被送到哪里。
      排气式把湿空气直接送出去。
      冷凝式和热泵式送过冷表面。
      水蒸气结成水滴，落进水盒。
      第四步，变干的空气再次加热。
      然后送回滚筒，继续带水。
      热泵是在搬家热量，往往更省电。
      衣服干了，是水被拿出筒外。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么水盒满了，衣服烘不干？
      冷凝水没有地方去，机器会停。
      为什么滤网一堵，时间就变长？
      风量小了，水蒸气带不走。
      为什么不是越烫越好？
      水离开衣服，靠蒸发和把湿气带走。
      温度太高，有的纤维会受伤。
      羊毛和丝绸，还是要看衣服上的护理标。
      塞得太满，风穿不过去，中间会一直潮。
      一句话：暖风把水变成气，冷面再把它变成水。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：暖风带走水蒸气。
      冷凝或者排气，把水拿出筒外。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆挂烫机，还是换个别的家电？评论区告诉我。
