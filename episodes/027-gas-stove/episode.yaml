douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解燃气灶
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：燃气灶。

    本集拆解：
    1. 喷嘴卷进一次空气，火孔外的二次空气帮外焰烧完
    2. 电火花只负责点燃；空气够了，火焰才是稳定的蓝火
    3. 热电偶被火烤热，电磁阀才保持打开。火灭了，阀就关上

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #燃气灶原理 #预混火焰 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：燃气灶靠什么把火稳住。
      很多人以为，旋钮只是把燃气点着。
      火开得越大，菜就熟得越快。
      其实要先把燃气和空气配好。
      喷嘴喷出燃气，同时卷进空气。
      混合气从火盖的小孔出来。
      电火花只负责点燃那一下。
      之后燃气继续遇到氧气，火焰才留得住。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      旋钮打开气阀，燃气来到喷嘴。
      喷嘴是一个小孔，气流在这里变快。
      旁边的风门留着一道缝。
      快速的气流，会把空气卷进来。
      这口空气叫一次空气。
      混合气从火盖周围的火孔冒出。
      火孔外还有二次空气。
      外焰靠它把燃烧做完。
      点火针跳出电火花，把气点着。
      空气够的时候，火焰是蓝色的。
      内锥表面开始烧，外焰接着烧完。
      火孔旁有一根热电偶。
      它被火烤热，会产生微弱电流。
      电流让电磁阀保持打开。
      火灭了，它凉下来，气阀自己关上。
      它是一个温度开关，不是警报器。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：火怎么稳住，又把锅烧热？
      第一步，燃气从喷嘴喷出，卷进一次空气。
      第二步，混合气从火孔均匀冒出。
      第三步，电火花点燃靠近针尖的气。
      火焰再绕着火盖连成一圈。
      第四步，外焰对着锅底，把热量传进去。
      燃气遇氧气，变成二氧化碳和水汽，同时放热。
      空气配少了，火焰发黄、发软。
      锅底容易熏黑，热量也更差。
      空气配多了，火焰会发飘，离开火孔。
      风门就是用来配一次空气的。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么正常的火是蓝的，不是越黄越旺？
      蓝色说明一次空气比较够。
      发黄常常是空气不够，燃烧不充分。
      为什么火开到最大，菜不一定熟得更快？
      窜出锅底的火，没有用来加热食物。
      为什么汤一溢出来，火会自己灭？
      汤把火焰浇灭，热电偶凉了。
      气阀跟着关上，燃气不再白流。
      天然气和液化气是同一套。
      不同的是喷嘴孔径，它决定卷进多少空气。
      锅外烧的是燃料，不是磁场让锅自己热。
      一句话：先混好空气，再在外焰把热交给锅。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：先混空气，再点燃。
      蓝火对着锅底，热才进锅里。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆哪一件？评论区告诉我。
