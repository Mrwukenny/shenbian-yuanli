douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解洗地机
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：洗地机。

    本集拆解：
    1. 清水箱只把水送到滚刷，滚刷把污渍搅起来
    2. 刮条把水赶进吸缝，脏水进另一只污水箱
    3. 两箱不连通。地毯会把水留住，这集只讲硬地面

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #洗地机原理 #清水污水分开 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：洗地机靠什么不把脏水涂回去。
      很多人以为，它就是一块会转的湿拖布。
      脏水存在刷子里，再涂回地上。
      其实清水和污水，各有一只箱子。
      清水只出一点点，淋湿滚刷。
      滚刷把污渍搅起来。
      吸力马上把脏水抽走。
      脏水进的是另一只箱子。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      机身里有两只水箱。
      一只是清水箱。
      清水箱连着一只小水泵。
      水泵只把清水送到滚刷。
      水量不大，地上不该积成一摊。
      底下是一只滚刷。
      电机带着它转。
      刷毛把黏住的污渍搅松。
      你可以把它理解成小拖把。
      只是它不把水存在刷子里。
      滚刷后面有一条吸缝。
      吸缝边上还有一条刮条。
      刮条把地面的水赶进吸缝。
      刮条贴着地，才赶得动那层水。
      吸力把脏水抽上来。
      你可以把这一段理解成小吸尘器。
      它收的是水，不是在烘干地面。
      脏水掉进污水箱，空气出去。
      水泵不从污水箱里抽水。
      两只箱子，各走各的。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：脏水怎么不涂回去？
      第一步，清水从清水箱流出。
      小水泵把它送到滚刷上。
      第二步，滚刷转起来。
      污渍被搅进这层水里。
      第三步，刮条把水赶进吸缝。
      空气带着脏水一起上来。
      水留在箱里，空气再排出去。
      第四步，地面只留薄薄一层。
      刷过以后，地上不该留着一摊。
      污水箱里的水，不会再送回去。
      没有吸力，滚刷就只是在涂。
      说白了，刷负责擦，吸负责收。
      两只箱子，把清和脏分开。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么拖完还有脏水味？
      污水和头发留在污水箱。
      也缠在一直湿着的滚刷上。
      箱子不倒，刷子不干，味就在。
      不是清水箱里的水坏了。
      为什么地面会留下水痕？
      出来的水，比吸回去的多。
      刮条没贴住，水就留在砖上。
      为什么它不适合洗地毯？
      地毯会把水吸进纤维里。
      吸缝收不回已经渗进去的水。
      这集只讲硬地面。
      一句话：清水去擦，脏水进另一只箱。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：滚刷只负责擦。
      脏水吸进污水箱，不再涂回去。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆饮水机，还是换个别的家电？评论区告诉我。
