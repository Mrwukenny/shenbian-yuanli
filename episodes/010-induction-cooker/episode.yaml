douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解电磁炉
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：电磁炉。

    本集拆解：
    1. 电磁炉不是靠电热丝烤锅底
    2. 交变磁场如何在锅里产生涡流
    3. 为什么有的锅不能用

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #电磁炉原理 #涡流 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：电磁炉是怎么把锅烧热的。
      很多人以为，面板下面有电热丝，先把板烤热再传给锅。
      其实面板几乎不发热，发热的是锅本身。
      它用交变磁场在锅底「感应」出电流，电流遇电阻就变成热。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      面板下是线圈盘，通入高频交变电流。
      线圈产生交变磁场，穿过锅底。
      锅必须是铁磁性的，磁场才能有效耦合，并产生涡流。
      电路里有功率管和控制系统，负责变频、调功率和保护。
      散热风扇给内部电子元件降温，因为损耗会变成热。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：热从哪来？
      第一步，线圈里电流方向快速变化，磁场也快速变化。
      第二步，变化的磁场在锅底感应出涡流。
      第三步，涡流在金属里流动，克服电阻做功，宏观上就是锅底发热。
      第四步，热量再传给食物。面板是绝缘微晶玻璃，主要起支撑和隔热，不是热源。
      所以你摸面板，往往没有锅那么烫，这很正常。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么铝锅、铜锅常常不能用或效果差？它们磁耦合弱，涡流加热效率低。
      为什么锅离板太远就不加热？磁场耦合变弱，感应电流上不去。
      为什么空烧会保护关机？温度传感器发现异常升高，系统切断功率。
      一句话：电磁炉加热的是「合格的锅」，不是烤热一块板。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：线圈造交变磁场，锅里起涡流，涡流变热煮食物。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想拆微波炉对比篇、空气炸锅，还是电烤箱？评论区告诉我。
