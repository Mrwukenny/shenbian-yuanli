douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解电热水壶
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：电热水壶。

    本集拆解：
    1. 电阻发热把水烧开，不是在读一百度
    2. 蒸汽推动双金属片，咔哒断开电源
    3. 干烧另有过热保护，水垢会让底板提前过热

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #电热水壶原理 #双金属片 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：电热水壶怎么知道水开了。
      很多人以为，壶里有温度计，到一百度就关。
      其实常见机械壶，并不在读数字温度。
      电阻把水烧开，蒸汽推动双金属片。
      双金属片弯够了，就把开关顶开。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      壶底是电热盘，里面是电阻丝或发热膜。
      通电后电阻发热，热穿过底板进到水里。
      壶身放正，底座电极才接通。
      壶盖附近有蒸汽通道，通到手柄开关。
      开关里有双金属片，两层金属热胀不同。
      受热会弯，弯够了就咔哒断开。
      旁边还有过热保护。干烧时底板太烫。
      它会另外切断电源，不靠蒸汽。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：为什么水开它会跳？
      第一步，通电。电阻发热，底板把热传给水。
      没跳闸之前，功率基本是满的。
      第二步，底板附近先冒小泡。
      这时蒸汽还不多，双金属片没弯够。
      第三步，整壶沸腾，蒸汽冲进通道。
      蒸汽送到双金属片上，片才受热。
      第四步，金属片弯曲，顶开触点。
      电源断开。你听到的咔哒，就是它。
      所以它等的是蒸汽，不是一百度。
      高山上水不到一百度就开，一样会跳。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么烧到最后不会放慢？
      普通壶不中途调功，要么满功率，要么断。
      为什么水垢多了又慢，还可能早跳？
      水垢挡传热。水没开，底板已经过热。
      过热保护会先动作，蒸汽开关还没轮到。
      为什么大开盖子，有的壶就不跳？
      蒸汽没进通道，双金属片收不到热。
      一句话：电阻发热，蒸汽推开金属片。
      干烧另有一道过热保护。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：电阻发热，蒸汽找金属片。
      咔哒一声就断电。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆洗碗机，还是换个别的家电？评论区告诉我。
