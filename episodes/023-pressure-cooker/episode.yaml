douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解电压力锅
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：电压力锅。

    本集拆解：
    1. 密封以后蒸汽留在锅里，压力升高
    2. 压力高了，水要到一百一十度上下才沸腾
    3. 浮子阀锁住锅盖，限压阀放掉多余蒸汽。它不是把食物压碎

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #电压力锅原理 #沸点升高 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：电压力锅靠什么煮得更快。
      很多人以为，它是火力更大的电饭煲。
      或者靠压力，把食物压碎。
      其实两件都不是。
      锅盖密封之后，蒸汽不容易跑出去。
      锅里的压力就会升高。
      压力一高，水要更热才沸腾。
      食物是在更高的温度里变熟的。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      内胆下面是加热盘。
      它把热量传给水和食物。
      锅盖边缘有一圈密封圈。
      蒸汽先被这圈胶圈拦住。
      盖上有个浮子阀。
      压力起来，浮子被蒸汽顶起。
      锅盖就被锁住，这时候拧不开。
      旁边是限压阀。
      压力到了设定值，它放掉一点蒸汽。
      锅内压力就停在这一档。
      家用常见的，比外面高出几十千帕。
      水要到一百一十度上下才沸。
      具体看型号，不必记成一个死数。
      加热盘还会看温度，自动减弱。
      它和电饭煲不一样。
      电饭煲敞着排气。
      水还是在一百度附近沸腾。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：为什么能超过一百度？
      第一步，加热盘把内胆里的水烧热。
      第二步，密封圈把蒸汽留在锅里。
      蒸汽越积越多，压力跟着升高。
      第三步，压力高了，气泡更难冒出来。
      所以沸腾的温度一起升高。
      食物就泡在更热的水和蒸汽里。
      第四步，限压阀放掉多余的蒸汽。
      压力就被维持在这一档。
      做完要等压力落下来。
      浮子掉回去，锅盖才拧得开。
      说白了，它是把沸点抬高。
      不是把食物压扁。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么工作的时候，盖子拧不动？
      浮子被气压顶起来，卡住了锁。
      等压力落下就开，不是盖子坏了。
      为什么中间会嘶地排气？
      限压阀在放掉多出来的蒸汽。
      压力就被维持在设定附近。
      为什么几乎不放水，就煮不好？
      热要靠水和蒸汽传开。
      锅里太干，温度保护会先停下。
      和普通炖锅比，开着盖最高大约一百度。
      盖严之后，同样的水可以更热。
      所以有些食材会更快变软。
      一句话：密封抬高压力，压力抬高沸点。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：密封让压力升高。
      水要更热，才会沸腾。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆干衣机，还是换个别的家电？评论区告诉我。
