douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解消毒柜
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：消毒柜。

    本集拆解：
    1. 高温要在一百二十度上下停够时间，热才会让蛋白质变形
    2. 臭氧能进到气体到得了的缝，紫外线只能照到光打到的表面
    3. 残渣和叠紧的碗会挡住它们。这集不把整柜说成无菌

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #消毒柜原理 #热与紫外 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：消毒柜靠什么处理餐具。
      很多人以为，门一关，里面就都干净了。
      或者把它当成一个会加热的碗柜。
      其实要看它走的是哪一档。
      高温靠持续的热。
      臭氧靠一种会氧化的气体。
      紫外线只作用在光打到的表面。
      三条路，都怕餐具上还糊着残渣。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      柜里有层架，用来把碗盘分开。
      高温那一档，加热管把腔体烤热。
      温度要到一百二十度上下。
      还得在这个温度停一段时间。
      热让微生物里的蛋白质变形。
      只是摸起来烫，时间不够，不算完成。
      臭氧那一档，腔内有一小块陶瓷片。
      它让空气里的一部分氧变成臭氧。
      臭氧会氧化它碰到的表面。
      之后它自己变回氧气。
      紫外线那一档，是一根紫外灯。
      光要直接打到餐具表面才有用。
      碗叠在一起，被挡住的那一面照不到。
      塑料怕高温，常常放在另一室。
      陶瓷和金属，才进高温那一室。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：表面是怎么被处理到的？
      第一步，先把残渣洗掉。
      污渍会挡住热、气体和光。
      第二步，碗盘分开，别叠成一摞。
      要让热空气、臭氧或光线碰得到表面。
      第三步，看机器走哪一条路。
      高温是把腔体维持在设定温度。
      臭氧钻进缝里，再变回氧气。
      紫外线只处理被光打到的那一面。
      第四步，程序按时间结束。
      没到时间就开门，这一轮就停了。
      它减少的是碰得到的表面微生物。
      不是把整柜东西都变成无菌。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么叠得很紧，程序跑完还不放心？
      紫外线过不去碗和碗之间。
      贴死的缝，热和臭氧也难进去。
      为什么塑料碗不能放进高温层？
      那一层靠的是持续的热。
      塑料会变形，所以走另一室。
      为什么结束时会有一股气味？
      那常常是还没散完的臭氧。
      它会自己变回氧气，不是加热管烧糊了。
      餐具上的油和饭粒要先洗掉。
      这集只讲热、臭氧和紫外线怎么作用。
      一句话：先洗净、再摊开，热或光才碰得到。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：先洗净，再摊开。
      热、臭氧或紫外线，才碰得到表面。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆哪一件？评论区告诉我。
