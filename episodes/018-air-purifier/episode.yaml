douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解空气净化器
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：空气净化器。

    本集拆解：
    1. 风扇抽气，纤维拦住颗粒，不是在制造氧气
    2. 零点三微米附近最难拦，净化快慢大致是风量乘效率
    3. 活性炭会饱和；二氧化碳靠通风，负离子也代替不了滤网

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #空气净化器原理 #过滤吸附 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：空气净化器靠什么把空气变干净。
      很多人以为，它在制造新鲜氧气。
      或者靠负离子，把灰尘消灭掉。
      其实两件都不是。
      风扇把房间里的空气抽进来。
      颗粒撞上滤网纤维，被留下来。
      一部分气味，暂时吸在活性炭上。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      进风口有一层粗网。
      它拦住头发和毛絮。
      后面是细密的折叠滤网。
      它不是均匀的小筛孔。
      大颗粒惯性大，直接撞上纤维。
      稍小的擦过纤维，被粘住。
      再小的会乱晃，晃着也会碰上。
      零点三微米附近，最难拦住。
      所以过滤效率，常标在这一档。
      再往后是活性炭。
      小孔先把一部分气味分子吸住。
      孔满了就不再吸附，要更换。
      它不把气味变成无害气体。
      风扇决定有多少空气穿过。
      净化得有多快，大致是风量乘效率。
      指示灯只是粗测颗粒，不是化验单。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：脏空气怎么变少？
      第一步，风扇把房间空气抽进来。
      第二步，粗网挡毛发，细纤维抓住颗粒。
      第三步，相对干净的空气送回房间。
      房间不是被抽成真空。
      颗粒是被一遍遍稀释。
      第四步，活性炭吸附一部分气味。
      饱和之后，味道会重新漏出来。
      所以这是循环过滤，不是一次抽干。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么滤网该换了，机器还在转？
      风量掉了，拦住的灰也变少。
      灯却还可能亮着。
      为什么开着窗，数值下不来？
      新的脏空气一直进来。
      机器在和室外赛跑。
      为什么它降不了二氧化碳？
      二氧化碳是气体。
      纤维滤网不管它。
      普通活性炭也几乎不抓它。
      人多了，还是要通风。
      负离子可能让颗粒粘到墙上。
      墙上还是脏的，灰也没进滤网。
      有的还会带出臭氧。
      臭氧刺激呼吸道，别拿它代替滤网。
      一句话：风扇送风，纤维拦灰，炭吸附气味。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：风扇送风，纤维拦颗粒。
      活性炭只是暂时吸附。
      它不制造氧气。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆咖啡机，还是换个别的家电？评论区告诉我。
