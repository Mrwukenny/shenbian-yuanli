douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解面包机
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：面包机。

    本集拆解：
    1. 搅拌桨把面粉和水揉出能兜住气泡的面筋
    2. 酵母在温热里产气，面团胀起来。这时还不是在烤
    3. 之后加热定型，表皮变色。热来得太早，酵母会停

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #面包机原理 #先发后烤 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：面包机靠什么做出面包。
      很多人以为，它就是一台会定时的小烤箱。
      面团放进去，热一烤就膨胀。
      其实前面大半段，它并不在烤。
      搅拌桨先把面粉和水揉在一起。
      酵母在温热里产生气体。
      面团胀起来以后，加热才开始。
      烤的是已经发好的面团。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      桶底有一支搅拌桨。
      电机带着它转，把材料揉匀。
      面粉里的蛋白质遇水。
      再被反复拉扯，连成一张网。
      这张有弹性的网，叫面筋。
      你可以把它理解成兜住气泡的网。
      酵母是活的。
      它吃面团里的糖，放出气体。
      这些气体里，主要是二氧化碳。
      桶壁先保持温热，酵母才愿意工作。
      太烫的话，酵母会先停掉。
      所以发酵这一段，不是烤箱的温度。
      后面桶壁的加热管才真正升温。
      淀粉变黏，蛋白质凝固。
      面包的形状就被热定住。
      表面更热，颜色变深。
      那是糖和蛋白质在表皮相遇。
      程序只是按时间，切换揉面、等待和加热。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：面团怎么变成面包？
      第一步，搅拌桨把面粉、水和酵母揉到一起。
      面筋被拉出来，变成有弹性的网。
      第二步，机器保持温热，先不烤。
      酵母产气，气体被面筋兜住。
      面团因此变大。
      第三步，有的程序会再揉一下。
      大泡被分成更多小泡。
      第四步，加热管升温，开始烘烤。
      酵母在更烫的环境里停止工作。
      结构被热定住，表皮慢慢变色。
      一开始就用高温，酵母活不久。
      网还没兜住气，面包就发不起来。
      所以顺序是先揉，再发，最后烤。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么有的面包又小又硬？
      面筋没揉开，或者酵母没在温热里待够。
      气兜不住，体积就起不来。
      为什么中间会自己再转一会儿？
      那是在把过大的气泡分开。
      不是程序乱了。
      为什么不能先把桶预热得很烫？
      发酵要的是温热，不是烘烤的热。
      太早升温，酵母还没产气就停了。
      这集不展开配方。
      只讲机器按什么顺序动手。
      一句话：先揉出面筋，再产气，最后加热定型。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：先揉，再发，最后烤。
      热来得太早，酵母会停。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆浴霸，还是换个别的家电？评论区告诉我。
