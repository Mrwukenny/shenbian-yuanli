douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解吹风机
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：吹风机。

    本集拆解：
    1. 风扇负责风，电热丝负责热
    2. 为什么不能堵出风口
    3. 冷热风档怎么切换

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #吹风机原理 #电热丝 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：吹风机是怎么又吹风又加热的。
      很多人以为，里面有一个「热风扇」同时干两件事。
      其实是分工明确：小风扇制造气流，电热丝把流过的空气加热。
      风是搬运工，热是路上加的料。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先认识几个主角。
      尾部进风口有滤网，挡住头发碎片，保护电机。
      电机带着叶轮转，把空气从尾部吸进、从头部吹出。
      风道中间是电热丝，通电发热，空气掠过就被加热。
      温控开关和保险丝是安全员：过热就断电，防止烫坏外壳甚至起火。
      档位开关控制电机转速和是否给电热丝通电，所以有冷风、热风、强弱风。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：热风怎么产生？
      第一步，叶轮旋转，形成从进风口到出风口的气流。
      第二步，电热丝电阻发热，温度迅速升高。
      第三步，空气流过热丝，带走热量，从风嘴喷出热风。
      第四步，热风加快头发表面水分蒸发，你感觉「干得快」。
      关掉加热只留风扇，就是冷风档：还在吹，只是不再加热。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个使用注意。
      为什么不能堵出风口？气流一停，热丝热量散不出去，极易过热跳闸甚至损坏。
      为什么滤网要清理？进风不足，风量下降，同样容易积热。
      为什么离头皮太近易烫？出风口温度高，距离近热通量更大。
      一句话：吹风机是「风 + 热」组合拳，通风永远比加热优先。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：风扇造风，电热丝加热，过热保护守底线。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想拆电动牙刷、剃须刀，还是加湿器？评论区告诉我。
