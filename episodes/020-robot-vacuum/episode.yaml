douyin:
  title: 身边原理｜我是Ken，挑战每天用3分钟带你了解扫地机器人
  description: |
    我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：扫地机器人。

    本集拆解：
    1. 室内不靠卫星，靠激光测距，或陀螺仪加轮子计数
    2. 边刷拨边角，滚刷把灰掀起来，风机送进尘盒
    3. 和手持、桶式吸尘器的差别在认路，不在另一种吸力

    系列：身边原理｜每天带你多懂一个原理
    #身边原理 #科普 #扫地机器人原理 #激光测距 #抖音知识

scenes:
  - id: hook
    blender_scene: hook
    narration: |
      我是Ken，挑战每天用3分钟带你了解一个身边原理，今天：扫地机器人怎么知道扫到哪了。
      很多人以为，它靠室内卫星认路。
      其实屋里卫星信号不够用。
      它靠轮子计数和陀螺仪。
      或者靠头顶转一圈的激光。
      激光量的是到墙的距离。
      扫地靠边刷、滚刷和尘盒。
      吸力和手持、桶式吸尘器是同一类。
      这集不再把气压差拆一遍。

  - id: cutaway
    blender_scene: cutaway
    narration: |
      先把认路和扫地分开。
      边刷在侧面转，把墙边的灰拨向中间。
      底部滚刷拍打地面，把灰掀起来。
      风机抽气，灰进尘盒。
      这是清扫。
      认路是另一套零件。
      顶上的激光雷达转一圈，量周围距离。
      轮子里的码盘，记下转了多少圈。
      一圈大约对应一段路程。
      陀螺仪记住拐了多大的弯。
      前面有防撞条。
      底下有红外，专门看台阶。
      多数机没有专门找灰的眼睛。
      它扫的是地面，不是每一粒灰。

  - id: cycle
    blender_scene: cycle
    narration: |
      关键来了：房间怎么走完？
      第一步，激光转一圈，量到墙和家具。
      第二步，和已经扫到的轮廓对上。
      于是知道自己在哪。
      第三步，按路线来回走。
      边刷把边角的灰拨向滚刷。
      第四步，滚刷扬灰，风机送进尘盒。
      没有激光的机器，用陀螺仪保持方向。
      撞到墙，再拐弯。
      地毯上轮子一打滑，码盘就会记错。
      路线于是慢慢漂。

  - id: analogy
    blender_scene: analogy
    narration: |
      这也解释了几个现象。
      为什么在椅子腿下绕来绕去？
      激光看到的是一根根腿。
      不是「椅子」这个词。
      它只是在绕开障碍。
      为什么尘盒满了还在全屋跑？
      认路还在，吸力已经差了。
      跑完全程，不等于灰都进了盒。
      为什么窄缝里还是有灰？
      边刷够得到墙边。
      够不到比机身更矮的缝。
      一句话：激光或陀螺仪负责认路。
      边刷滚刷送灰，风机收进尘盒。

  - id: outro
    blender_scene: outro
    narration: |
      记住口诀：激光或陀螺仪认路。
      边刷、滚刷、尘盒负责扫地。
      关注身边原理，我是Ken，明天继续带你了解下一个原理。
      你还想接着拆除湿机，还是换个别的家电？评论区告诉我。
